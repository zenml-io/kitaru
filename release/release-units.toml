schema-version = 1

[release-checks]
common = [
    "release-units",
    "lint",
    "client-import",
    "typos",
    "typecheck",
    "audit",
    "Public template against current Kitaru",
    "docker-smoke",
    "plugin-tests",
    "test (py311-base)",
    "test (py312-base)",
    "test (py313-base)",
    "test (py314-base)",
]

[[units]]
slug = "kitaru"
path = "."
distribution = "kitaru"
registry = "pypi"
version-source = "pyproject.toml"
default-catalog = false
tag-prefix = "python/kitaru/v"
checks = [
    "cli-artifact-contract",
    "mcp-wheel-contract",
    "test (py311-cli)",
    "test (py312-cli)",
    "test (py313-cli)",
    "test (py314-cli)",
    "test (py311-mcp)",
    "test (py312-mcp)",
    "test (py313-mcp)",
    "test (py314-mcp)",
]

[[units]]
slug = "braintrust-importer"
path = "plugins/packages/braintrust-importer"
distribution = "kitaru-braintrust-importer"
registry = "pypi"
version-source = "plugins/packages/braintrust-importer/pyproject.toml"
default-catalog = true
tag-prefix = "python/kitaru-braintrust-importer/v"
checks = ["plugin package (braintrust-importer)"]

