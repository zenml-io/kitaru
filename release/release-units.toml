schema-version = 1

[release-checks]
common = [
    "release-units",
    "lint",
    "client-import",
    "typos",
    "typecheck",
    "audit",
    "Quickstart example end to end",
    "docker-smoke",
    "plugin-tests",
    "test (py311-base)",
    "test (py312-base)",
    "test (py313-base)",
    "test (py314-base)",
]

[[units]]
slug = "kitaru"
path = "."
distribution = "kitaru"
registry = "pypi"
version-source = "pyproject.toml"
changelog = "CHANGELOG.md"
lock-source = "uv.lock"
default-catalog = false
release-label = "requires:core"
impact-paths = [
    "pyproject.toml",
    "CHANGELOG.md",
    "uv.lock",
    "src/kitaru/**",
    "openapi/**",
    "releases/python/kitaru/**",
    "docker/**",
    "helm/**",
]
tag-prefix = "python/kitaru/v"
maintenance-branch-prefix = "release/kitaru/"
checks = [
    "cli-artifact-contract",
    "mcp-wheel-contract",
    "test (py311-cli)",
    "test (py312-cli)",
    "test (py313-cli)",
    "test (py314-cli)",
    "test (py311-mcp)",
    "test (py312-mcp)",
    "test (py313-mcp)",
    "test (py314-mcp)",
]

[[units]]
slug = "braintrust"
path = "plugins/packages/braintrust"
distribution = "kitaru-braintrust"
registry = "pypi"
version-source = "plugins/packages/braintrust/pyproject.toml"
changelog = "plugins/packages/braintrust/CHANGELOG.md"
lock-source = "plugins/uv.lock"
default-catalog = false
release-label = "requires:plugin:braintrust-adapter"
impact-paths = ["plugins/packages/braintrust/**"]
tag-prefix = "python/kitaru-braintrust/v"
maintenance-branch-prefix = "release/braintrust-adapter/"
checks = ["plugin package (braintrust)"]

