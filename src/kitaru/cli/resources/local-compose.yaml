services:
  server:
    image: ${KITARU_LOCAL_SERVER_IMAGE}
    platform: linux/amd64
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      KITARU_SERVER_DB_HOST: db
      KITARU_SERVER_DB_USER: postgres
      KITARU_SERVER_DB_PWD: ${KITARU_LOCAL_DB_PASSWORD}
      KITARU_SERVER_DB_NAME: kitaru
      KITARU_SERVER_AUTH_SCHEME: none
      KITARU_SERVER_JWT_SIGNING_KEY: ${KITARU_LOCAL_JWT_SIGNING_KEY}
      KITARU_SERVER_SECRET_ENCRYPTION_KEY: ${KITARU_LOCAL_SECRET_ENCRYPTION_KEY}
      KITARU_SERVER_ANALYTICS_OPT_IN: "${KITARU_SERVER_ANALYTICS_OPT_IN:-true}"
      KITARU_SERVER_ANALYTICS_DEBUG: "${KITARU_SERVER_ANALYTICS_DEBUG:-false}"
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kitaru
      POSTGRES_PASSWORD: ${KITARU_LOCAL_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kitaru"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
