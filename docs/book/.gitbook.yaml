# GitBook space config for the Kitaru documentation.
#
# Point a GitBook space's Git Sync at this repository and set the space's
# root directory to `docs/book/` (this file's directory). The space base path
# on docs.zenml.io (e.g. `/kitaru`) is decided with the docs.zenml.io owner.
root: .

structure:
  readme: README.md
  summary: toc.md

# Old URLs → current file locations. Keep every removed or moved page here so
# existing inbound links resolve.
