[project]
name = "kitaru"
version = "0.21.0"
description = "Record, replay, and improve AI agents in production."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "ZenML GmbH", email = "info@zenml.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "ai-agents",
    "durable-execution",
    "workflow",
    "orchestration",
    "checkpoints",
    "replay",
    "llm",
    "mlops",
    "pydantic",
    "observability",
]
dependencies = [
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0,<3",
]
cli = [
    "cyclopts>=4.22",
    "packaging>=24.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]
examples = [
    "langfuse>=4.14,<5",
]
server = [
    "fastapi>=0.139",
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.18",
    "uvicorn>=0.51",
    "pydantic-settings>=2.14",
    "asyncpg>=0.31",
    "bcrypt>=4.1",
    "pyjwt>=2.13",
    "python-multipart>=0.0.9",
    "uuid-utils>=0.10",
    "cryptography>=49.0.0",
    "packaging>=24.0",
]
worker = [
    "pydantic-settings>=2.14",
]
otel = [
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]

[project.scripts]
kitaru = "kitaru.cli:main"
kitaru-mcp = "kitaru.mcp_entrypoint:main"

[project.urls]
Homepage = "https://kitaru.ai"
Documentation = "https://docs.zenml.io/kitaru"
Repository = "https://github.com/zenml-io/kitaru"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru"]

[tool.uv]
exclude-newer = "3 days"

[dependency-groups]
dev = [
    "pydantic-ai-slim[openai]>=2.23.0,<2.24",
    "ruff>=0.11",
    "ty>=0.0.1a7",
    "yamlfix",
    "pytest>=8.0",
    "import-linter>=2.0",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
target-version = "py311"
src = ["src", "scripts", "tests"]
line-length = 88
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "plugins",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (enforces modern type annotations)
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
    "kitaru",
    "kitaru_openai_agents",
    "kitaru_pydantic_ai",
]

[tool.ty.src]
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
# TODO: Re-enable once the examples are migrated to the v2 SDK.
exclude = ["examples/**"]

[tool.ty.environment]
python-version = "3.11"
root = [".", "src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_packages = ["kitaru"]

[[tool.importlinter.contracts]]
name = "client and server are independent, both sit on the shared packages"
type = "layers"
layers = [
    "kitaru.client | kitaru.server",
    "kitaru.api_models | kitaru.analytics | kitaru.transport",
]

[[tool.importlinter.contracts]]
name = "MCP does not depend on optional frontends"
type = "forbidden"
source_modules = ["kitaru.mcp", "kitaru.mcp_entrypoint"]
forbidden_modules = ["kitaru.cli", "kitaru.server"]

[[tool.importlinter.contracts]]
name = "MCP sits above the client and shared packages"
type = "layers"
layers = [
    "kitaru.mcp | kitaru.mcp_entrypoint",
    "kitaru.client",
    "kitaru.api_models | kitaru.analytics | kitaru.transport",
]

[[tool.importlinter.contracts]]
name = "server layering"
type = "layers"
layers = [
    "kitaru.server.adapters",
    "kitaru.server.application",
    "kitaru.server.domain",
]
