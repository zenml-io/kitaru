[project]
name = "kitaru"
version = "0.27.2+dev"
description = "Record, replay, and improve AI agents in production."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "ZenML GmbH", email = "info@zenml.io" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "ai-agents",
    "durable-execution",
    "workflow",
    "orchestration",
    "checkpoints",
    "replay",
    "llm",
    "mlops",
    "pydantic",
    "observability",
]
dependencies = [
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0,<3",
    "packaging>=24.0",
]
cli = [
    "cyclopts>=4.25.1",
    "packaging>=24.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]
examples = [
    "langfuse>=4.14,<5",
]
server = [
    "fastapi>=0.139",
    "sqlalchemy[asyncio]>=2.0.51,!=2.1.0",
    "alembic>=1.18",
    "uvicorn>=0.51",
    "pydantic-settings>=2.14",
    "asyncpg>=0.31",
    "bcrypt>=4.1",
    "pyjwt>=2.13",
    "python-multipart>=0.0.9",
    "uuid-utils>=0.10",
    "cryptography>=50.0.0",
    "packaging>=24.0",
]
worker = [
    "packaging>=24.0",
    "pydantic-settings>=2.14",
]
otel = [
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]
s3 = [
    "obstore>=0.11.1",
]
modal = [
    "modal>=1.5,<2",
]

[project.scripts]
kitaru = "kitaru.cli:main"
kitaru-mcp = "kitaru.mcp_entrypoint:main"

[project.urls]
Homepage = "https://kitaru.ai"
Documentation = "https://docs.zenml.io/kitaru"
Repository = "https://github.com/zenml-io/kitaru"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/kitaru/mcp/data/docs_index.json",
    "src/kitaru/_ui/dist/**",
    "src/kitaru/_ui/bundle_manifest.json",
    "src/kitaru/server/application/services/sample_data.json.gz",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru"]
# The wheel ships only the gzipped sample data, written by the release workflow.
exclude = ["src/kitaru/server/application/services/sample_data.json"]

[tool.uv]
exclude-newer = "3 days"

[dependency-groups]
dev = [
    "pip-audit>=2.10,<3",
    "ruff>=0.16.2",
    "ty>=0.0.72",
    "yamlfix",
    "pytest>=8.4",
    "import-linter>=2.0",
    "pytest-asyncio>=1.4.0",
    "griffe>=1.13.0,<2.0.0",
    "griffe-typingdoc>=0.2.8,<1.0.0",
    "hypothesis>=6.165",
    "hypothesis-jsonschema>=0.23",
    "pyyaml>=6.0",
    "coverage>=7.10",
    "moto[s3]>=5.2.3",
    "flask>=3.1",
    "flask-cors>=6.0",
    "pytest-xdist>=3.8",
]
fuzz = [
    "schemathesis>=4.25,<5",
]

[tool.ruff]
target-version = "py311"
src = ["src", "scripts", "tests"]
line-length = 88
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "plugins",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (enforces modern type annotations)
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle (Google convention, see [tool.ruff.lint.pydocstyle])
    # Complete production signatures; ty checks their types, Ruff their presence.
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",
    # Stable collection and return rules, audited individually against this tree.
    "C400", "C401", "C402", "C403", "C404", "C405", "C406", "C408", "C409",
    "C410", "C411", "C413", "C414", "C415", "C416", "C417", "C418", "C419", "C420",
    "PIE790", "PIE794", "PIE796", "PIE800", "PIE804", "PIE807", "PIE808", "PIE810",
    "RET501", "RET502", "RET503", "RET504", "RET505", "RET506", "RET507", "RET508",
    "PERF101", "PERF102", "PERF402",
    # Detect blocking I/O and broken cancellation in async code. Timeout parameters,
    # deliberate process polling, and filesystem scheduling require separate review.
    "ASYNC100", "ASYNC105", "ASYNC115", "ASYNC116", "ASYNC210", "ASYNC212",
    "ASYNC220", "ASYNC222", "ASYNC230", "ASYNC250",
    "DTZ001", "DTZ002", "DTZ003", "DTZ004", "DTZ005", "DTZ006", "DTZ007",
    "DTZ012", "DTZ901",
    "ERA001",  # Commented-out code; explanations of why remain a review standard.
    "TID251",  # Runtime annotation policy, configured below.
    "TRY002", "TRY201", "TRY203",
]

[tool.ruff.lint.per-file-ignores]
# Tests may omit docstrings (D1xx), but any docstring they do have must still
# follow the Google formatting rules (D2xx and up).
"tests/**" = ["D1"]
# Test doubles whose methods only mirror the real ADK surface; class-level
# docstrings already say what each fake stands in for.
"scripts/google_adk_fakes.py" = ["D1"]
# Production signatures are mandatory; fixture/callback and standalone script
# signatures retain their own contracts. This also covers future support folders.
"!src/**" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]
# These fixtures intentionally exercise naive datetimes or JSON redaction.
"tests/api_models/test_wire_properties.py" = ["DTZ001"]
"tests/cli/test_redaction_properties.py" = ["DTZ001"]
"tests/server/test_utils.py" = ["DTZ001"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Keep eagerly evaluated annotations for this repo's runtime model inspection.
"__future__.annotations" = { msg = "Use eager annotations so runtime model inspection does not depend on resolving postponed names." }

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
    "fixtures",
    "kitaru",
    "kitaru_openai_agents",
    "kitaru_pydantic_ai",
]

[tool.ty.src]
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py", "examples/**/*.py"]
# Exclude the Python adapter examples: they import plugin packages (kitaru-langgraph,
# kitaru-openai-agents) from the separate plugins workspace, which are not installed
# in the root environment. The TypeScript examples' Python drivers import only kitaru
# and are checked.
exclude = ["examples/python/**"]

[tool.ty.environment]
python-version = "3.11"
root = [".", "src", "scripts", "tests"]

[tool.ty.rules]
missing-type-argument = "error"
blanket-ignore-comment = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
invalid-ignore-comment = "error"
redundant-cast = "error"

# Documentation AST dictionaries and test doubles intentionally have dynamic
# shapes. Historical migration annotations are kept with their original revision.
[[tool.ty.overrides]]
include = [
    "scripts/generate_sdk_docs.py",
    "tests/scripts/test_generate_sdk_docs.py",
    "tests/mcp/test_handlers_protocol.py",
    "tests/mcp/test_review_workflows.py",
    "tests/server/test_fuzz_api.py",
    "tests/task/test_importer.py",
    "src/kitaru/server/database/migrations/versions/010_evaluation_provenance.py",
]

[tool.ty.overrides.rules]
missing-type-argument = "ignore"

# fumapy is installed from the npm package (docs/node_modules/fumadocs-python),
# not PyPI, so it is absent from most environments that run ty.
[[tool.ty.overrides]]
include = ["scripts/generate_sdk_docs.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["mcp_fuzz: generated-input MCP property tests"]

[tool.coverage.run]
source = ["src/kitaru"]
branch = true
relative_files = true
# Measure Python child processes too; modules such as
# kitaru.cli.plugin_test_runner only ever run in a subprocess.
patch = ["subprocess"]

[tool.coverage.report]
precision = 1

[tool.importlinter]
root_packages = ["kitaru"]

[[tool.importlinter.contracts]]
name = "client and server are independent, both sit on the shared packages"
type = "layers"
layers = [
    "kitaru.client | kitaru.server",
    "kitaru.api_models | kitaru.analytics | kitaru.transport",
]

[[tool.importlinter.contracts]]
name = "MCP does not depend on optional frontends"
type = "forbidden"
source_modules = ["kitaru.mcp", "kitaru.mcp_entrypoint"]
forbidden_modules = ["kitaru.cli", "kitaru.server"]

[[tool.importlinter.contracts]]
name = "MCP sits above the client and shared packages"
type = "layers"
layers = [
    "kitaru.mcp | kitaru.mcp_entrypoint",
    "kitaru.client",
    "kitaru.api_models | kitaru.analytics | kitaru.transport",
]

[[tool.importlinter.contracts]]
name = "server layering"
type = "layers"
layers = [
    "kitaru.server.adapters",
    "kitaru.server.application",
    "kitaru.server.domain",
]
