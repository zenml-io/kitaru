[project]
name = "kitaru"
version = "0.14.0"
description = "Durable execution for AI agents, built on ZenML"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "ZenML GmbH", email = "info@zenml.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "ai-agents",
    "durable-execution",
    "workflow",
    "orchestration",
    "checkpoints",
    "replay",
    "llm",
    "mlops",
    "pydantic",
    "observability",
]
dependencies = [
    "cyclopts>=3.0",
    "pydantic>=2.0",
    "rich>=12.0.0",
    "zenml[local]>=0.94.6",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0.0,<3",
]
anthropic = [
    "anthropic>=0.40.0,<1",
]
llm = [
    "kitaru[openai]",
    "kitaru[anthropic]",
]
local = [
    "zenml[server]>=0.94.6",
]
pydantic-ai = [
    "pydantic-ai-slim>=1.89.0,<1.104.0",
    "typing_extensions>=4.12",
]
openai-agents = [
    "openai-agents>=0.15.0,<0.18.0",
]
langgraph = [
    "langchain>=1.0,<2",
    "langgraph>=1.1,<2",
]
langgraph-openai = [
    "kitaru[langgraph]",
    "langchain-openai>=1.0,<2",
]
langgraph-anthropic = [
    "kitaru[langgraph]",
    "langchain-anthropic>=1.0,<2",
]
claude-agent-sdk = [
    "claude-agent-sdk>=0.1.58,<0.2",
]
gemini = [
    "google-genai>=1.55.0,<2",
]
mcp = [
    "mcp>=1.19.0,<1.20.0",
]

[project.scripts]
kitaru = "kitaru.cli:cli"
kitaru-mcp = "kitaru.mcp:main"

[project.entry-points."zenml.init_hooks"]
kitaru = "kitaru_init_hook:init"

[project.urls]
Homepage = "https://kitaru.ai"
Repository = "https://github.com/zenml-io/kitaru"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/kitaru/_ui/dist/**",
    "src/kitaru/_ui/bundle_manifest.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru", "src/kitaru_init_hook"]

[tool.uv]
exclude-newer = "3 days"
exclude-newer-package = { zenml = false, aiohttp = false }

[dependency-groups]
dev = [
    "ruff>=0.11",
    "ty>=0.0.1a7",
    "yamlfix",
    "zenml[server]>=0.94.6",
    "pytest>=8.0",
    "pytest-randomly",
    "pytest-clarity",
    "pytest-xdist[psutil]",
    "griffe>=1.13.0,<2.0.0",
    "griffe-typingdoc>=0.2.8,<1.0.0",
    "pydantic-ai-slim>=1.89.0,<1.104.0",
    "openai-agents>=0.15.0,<0.18.0",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.1,<2",
    "openai>=1.0.0,<3",
    "anthropic>=0.40.0,<1",
    "claude-agent-sdk>=0.1.58,<0.2",
    "google-genai>=1.55.0,<2",
    "pip-audit>=2.9.0",
]

[tool.ruff]
target-version = "py311"
src = ["src", "scripts", "tests"]
line-length = 88
exclude= [
    ".git",
    ".ruff_cache",
    ".venv"
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (enforces modern type annotations)
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Vendored from upstream `pydantic_ai.durable_exec.kitaru`; upstream owns the style.
# UP006/UP007/UP035/UP045: upstream uses `Dict`/`Optional`/`typing.List` aliases.
# UP008: upstream uses explicit `super(Cls, self)` in WrapperAgent subclass.
"src/kitaru/adapters/pydantic_ai/**" = ["E501", "I001", "UP006", "UP007", "UP008", "UP035", "UP045", "SIM105"]

[tool.ruff.format]
exclude = ["src/kitaru/adapters/pydantic_ai/**"]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["kitaru"]

[tool.ty.src]
exclude = ["examples/**"]

[tool.ty.environment]
python-version = "3.11"
root = ["src", "scripts", "."]

[[tool.ty.overrides]]
include = ["scripts/generate_sdk_docs.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["src/kitaru/adapters/pydantic_ai/_otel.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
# Smoke-test imports `agent_factory` / `mocks` from the example tree at runtime
# via the `_example_on_syspath` autouse fixture (in the test file); static
# analysis can't see those packages because `examples/**` is excluded from
# ty's first-party search root.
include = ["tests/test_agent_factory_example.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
# The wrapper entrypoints still rely on a few pyright-specific patterns upstream.
include = [
    "src/kitaru/adapters/pydantic_ai/_agent.py",
    "src/kitaru/adapters/pydantic_ai/_model.py",
    "src/kitaru/adapters/pydantic_ai/_toolset.py",
    "src/kitaru/adapters/pydantic_ai/_run_context.py",
]

[tool.ty.overrides.rules]
invalid-method-override = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
invalid-argument-type = "ignore"
no-matching-overload = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vv -n auto"
pythonpath = ["scripts"]
