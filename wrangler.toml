# Standalone Kitaru SDK + CLI reference site, served at sdkdocs.kitaru.ai
# (mirrors zenml's sdkdocs.zenml.io). Static assets only — the FumaDocs app is
# exported to docs/out and served at the domain root.
name = "kitaru-sdkdocs"
compatibility_date = "2025-09-27"

[assets]
directory = "./docs/out"
not_found_handling = "404-page"

[[routes]]
pattern = "sdkdocs.kitaru.ai"
custom_domain = true
