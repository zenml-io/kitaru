[project]
name = "kitaru-evaluator-tool-call-patterns"
version = "0.1.0"
description = "Tool-call pattern evaluator for Kitaru."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["kitaru>=0.21"]

[project.entry-points."kitaru.default_plugins"]
tool-call-patterns = "kitaru_evaluator_tool_call_patterns.catalog:get_definitions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_evaluator_tool_call_patterns"]

[tool.uv.sources]
kitaru = { workspace = true }
