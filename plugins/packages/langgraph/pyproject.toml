[project]
name = "kitaru-langgraph"
version = "0.1.0"
description = "LangGraph recording and replay adapter for Kitaru."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "kitaru>=0.22.0,<0.23",
    "langchain>=1.3.14,<2",
    "langchain-core>=1.5.3,<2",
    "langgraph>=1.2.10,<2",
]

[project.optional-dependencies]
deepagents = ["deepagents>=0.7.4,<0.8"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_langgraph"]

[tool.kitaru.artifact]
import-module = "kitaru_langgraph"
