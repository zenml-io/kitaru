[project]
name = "kitaru-post-import-insights"
version = "0.1.0"
description = "Post-import session insights for Kitaru."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "ZenML GmbH", email = "info@zenml.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ai-agents", "insights", "kitaru", "llm", "analysis"]
dependencies = [
    "kitaru==0.25.0+dev",
    "openai>=2.15,<4",
    "langfuse>=4.14,<5",
]

[project.urls]
Homepage = "https://kitaru.ai"
Documentation = "https://docs.zenml.io/kitaru"
Repository = "https://github.com/zenml-io/kitaru"
Issues = "https://github.com/zenml-io/kitaru/issues"
Changelog = "https://github.com/zenml-io/kitaru/blob/develop/plugins/packages/post-import-insights/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_post_import_insights"]
