[project]
name = "kitaru-evaluator-latency"
version = "0.1.0"
description = "Session-latency evaluator for Kitaru."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["kitaru>=0.21"]

[project.entry-points."kitaru.default_plugins"]
latency = "kitaru_evaluator_latency.catalog:get_definitions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_evaluator_latency"]

[tool.uv.sources]
kitaru = { workspace = true }
