[project]
name = "kitaru-typesafe-evaluator"
version = "0.1.0"
description = "Judge Kitaru sessions with TypeSafe's jev model and your own questions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "ZenML GmbH", email = "info@zenml.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ai-agents", "evaluation", "kitaru", "llm", "typesafe", "jev"]
dependencies = ["kitaru>=0.22.0", "typesafe-sdk==0.6.0"]

[project.urls]
Homepage = "https://kitaru.ai"
Documentation = "https://docs.zenml.io/kitaru/guides/judge-evaluations"
Repository = "https://github.com/zenml-io/kitaru"
Issues = "https://github.com/zenml-io/kitaru/issues"
Changelog = "https://github.com/zenml-io/kitaru/blob/develop/plugins/packages/typesafe-evaluator/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_typesafe_evaluator"]

[tool.kitaru.artifact]
import-module = "kitaru_typesafe_evaluator"
