[project]
name = "kitaru-openai-agents"
version = "0.1.0"
description = "OpenAI Agents SDK recording adapter for Kitaru."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "kitaru>=0.21",
    "openai-agents>=0.19.3,<0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_openai_agents"]

[tool.kitaru.artifact]
import-module = "kitaru_openai_agents"
