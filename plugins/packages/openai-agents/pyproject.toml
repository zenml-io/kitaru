[project]
name = "kitaru-openai-agents"
version = "0.1.0rc0"
description = "OpenAI Agents SDK recording adapter for Kitaru."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "kitaru>=0.22.0rc0,<0.23",
    "openai-agents>=0.19.3,<0.20",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_openai_agents"]

[tool.kitaru.artifact]
import-module = "kitaru_openai_agents"
