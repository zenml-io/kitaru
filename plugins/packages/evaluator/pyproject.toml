[project]
name = "kitaru-evaluator"
version = "0.1.0"
description = "Built-in deterministic evaluators for Kitaru."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["kitaru>=0.21"]

[project.entry-points."kitaru.default_plugins"]
evaluators = "kitaru_evaluator.catalog:get_definitions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_evaluator"]

[tool.uv.sources]
kitaru = { workspace = true }
