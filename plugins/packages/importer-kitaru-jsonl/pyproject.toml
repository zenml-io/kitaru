[project]
name = "kitaru-importer-kitaru-jsonl"
version = "0.1.0"
description = "Canonical JSONL session importer for Kitaru."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["kitaru>=0.21"]

[project.entry-points."kitaru.default_plugins"]
kitaru-jsonl = "kitaru_importer_kitaru_jsonl.catalog:get_definitions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_importer_kitaru_jsonl"]

[tool.uv.sources]
kitaru = { workspace = true }
