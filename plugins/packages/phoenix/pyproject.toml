[project]
name = "kitaru-phoenix"
version = "0.1.0"
description = "Arize Phoenix importer-backed adapter for Kitaru."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "ZenML GmbH", email = "info@zenml.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ai-agents", "arize-phoenix", "kitaru", "observability", "traces"]
dependencies = [
    "arize-phoenix-client>=2.0,<4",
    "kitaru>=0.23.0",
    "kitaru-phoenix-importer>=0.1.0",
    "opentelemetry-api>=1.12",
    "opentelemetry-sdk>=1.12",
]

[project.urls]
Homepage = "https://kitaru.ai"
Documentation = "https://docs.zenml.io/kitaru/adapters/phoenix"
Repository = "https://github.com/zenml-io/kitaru"
Issues = "https://github.com/zenml-io/kitaru/issues"
Changelog = "https://github.com/zenml-io/kitaru/blob/develop/plugins/packages/phoenix/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_phoenix"]

[tool.kitaru.artifact]
import-module = "kitaru_phoenix"
