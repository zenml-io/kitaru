[project]
name = "kitaru-braintrust-importer"
version = "0.1.0"
description = "Braintrust trace importer for Kitaru."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["kitaru>=0.21"]

[project.entry-points."kitaru.default_plugins"]
braintrust = "kitaru_braintrust_importer.catalog:get_definitions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_braintrust_importer"]

[tool.uv.sources]
kitaru = { workspace = true }
