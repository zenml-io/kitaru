[project]
name = "kitaru-pydantic-ai"
version = "0.1.0"
description = "PydanticAI recording and replay adapter for Kitaru."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "genai-prices>=0.1.1,<0.2",
    "kitaru>=0.22.0",
    "pydantic-ai-slim>=2.14.1,<2.23",
]

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]>=2.14.1,<2.23"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_pydantic_ai"]

[tool.kitaru.artifact]
import-module = "kitaru_pydantic_ai"
