[project]
name = "kitaru-opentelemetry-importer"
version = "0.1.1"
description = "OpenTelemetry trace importer for Kitaru."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["kitaru>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_opentelemetry_importer"]
