[project]
name = "kitaru-opentelemetry-importer"
version = "0.1.0rc0"
description = "OpenTelemetry trace importer for Kitaru."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["kitaru>=0.22.0rc0,<0.23"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_opentelemetry_importer"]
