[project]
name = "kitaru-importer-otlp"
version = "0.1.0"
description = "OTLP JSON trace importer for Kitaru."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "ZenML GmbH", email = "info@zenml.io" },
]
dependencies = [
    "kitaru>=0.21.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_importer_otlp"]
