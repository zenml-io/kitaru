[tool.uv]
exclude-newer = "3 days"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kitaru = { path = "..", editable = true }
kitaru-pydantic-ai = { workspace = true }

[dependency-groups]
dev = [
    "deepagents>=0.7.4,<0.8",
    "kitaru[server]",
    "kitaru-pydantic-ai[openai]",
    "langchain>=1.3.14,<2",
    "langchain-core>=1.5.3,<2",
    "langgraph>=1.2.10,<2",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11",
    "ty>=0.0.1a7",
]

[tool.ruff]
target-version = "py311"
src = ["adapters", "packages", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
    "adapters",
    "kitaru",
    "kitaru_evaluator",
    "kitaru_braintrust_importer",
    "kitaru_jsonl_importer",
    "kitaru_langfuse_importer",
    "kitaru_langsmith_importer",
    "kitaru_opentelemetry_importer",
    "kitaru_pydantic_ai",
]

[tool.ty.src]
include = ["adapters/**/*.py", "packages/*/src/**/*.py", "tests/**/*.py"]

[tool.ty.environment]
python-version = "3.11"
root = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
