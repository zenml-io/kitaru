[project]
name = "kitaru-plugins"
version = "0.1.0"
description = "Official importers and evaluators for Kitaru."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "ZenML GmbH", email = "info@zenml.io" },
]
dependencies = [
    "kitaru>=0.21",
]

[project.entry-points."kitaru.default_plugins"]
official = "kitaru_plugins.catalog:get_definitions"

[project.urls]
Homepage = "https://kitaru.ai"
Documentation = "https://docs.zenml.io/kitaru"
Repository = "https://github.com/zenml-io/kitaru"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kitaru_plugins"]

[tool.uv]
exclude-newer = "3 days"

[tool.uv.sources]
kitaru = { workspace = true }
