[project]
name = "kitaru-importer-langfuse"
version = "0.1.0"
description = "Langfuse trace importer for Kitaru."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "ZenML GmbH", email = "info@zenml.io" },
]
dependencies = [
    "kitaru>=0.21.0,<1",
]

[project.entry-points."kitaru.trace_importers"]
langfuse = "kitaru_importer_langfuse:parse"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_importer_langfuse"]
