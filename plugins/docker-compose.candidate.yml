---
name: kitaru-plugin-e2e
services:
  server:
    image: ${KITARU_PLUGIN_IMAGE:-kitaru-plugin-e2e:local}
    ports: ['${KITARU_PORT:-8000}:8000']
    depends_on:
      db:
        condition: service_healthy
    environment:
      KITARU_SERVER_DB_HOST: db
      KITARU_SERVER_DB_USER: postgres
      KITARU_SERVER_DB_PWD: password
      KITARU_SERVER_DB_NAME: kitaru
      KITARU_SERVER_LOG_LEVEL: DEBUG
      KITARU_SERVER_AUTH_SCHEME: none
      KITARU_SERVER_JWT_SIGNING_KEY: dev
      KITARU_SERVER_SECRET_ENCRYPTION_KEY: dev
      KITARU_SERVER_DEFAULT_ACCOUNT_PASSWORD: password
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: password
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
