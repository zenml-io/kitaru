{{- if .Values.server.gateway.enabled -}}
{{- $fullName := include "kitaru.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "kitaru.labels" . | nindent 4 }}
  {{- with .Values.server.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ required "gateway.gatewayRef.name is required when gateway.enabled=true" .Values.server.gateway.gatewayRef.name | quote }}
      {{- if .Values.server.gateway.gatewayRef.namespace }}
      namespace: {{ .Values.server.gateway.gatewayRef.namespace | quote }}
      {{- end }}
      {{- if .Values.server.gateway.sectionName }}
      sectionName: {{ .Values.server.gateway.sectionName | quote }}
      {{- end }}
  {{- if .Values.server.gateway.host }}
  hostnames:
    - {{ .Values.server.gateway.host | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.server.gateway.path | default "/" | quote }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.server.service.port }}
{{- end }}
