{{- if .Values.serviceAccount.create -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kitaru.serviceAccountName" . }}
  labels:
    {{- include "kitaru.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kitaru.serviceAccountName" . }}-db-migration
  labels:
    {{- include "kitaru.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-2" # Set your desired hook weight here
    "helm.sh/hook-delete-policy": before-hook-creation{{ if not .Values.server.debug }},hook-succeeded{{ end }}
  {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
