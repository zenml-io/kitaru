{{- define "secret.content" -}}
{{- $server := include "kitaru.serverValues" . | fromYaml -}}
{{- $prevServerSecret := (lookup "v1" "Secret" .Release.Namespace (include "kitaru.fullname" .)) -}}
data:
  {{- if $server.jwtSigningKey }}
  KITARU_SERVER_JWT_SIGNING_KEY: {{ $server.jwtSigningKey | b64enc | quote }}
  {{- else if $server.auth.jwtSigningKey }}
  KITARU_SERVER_JWT_SIGNING_KEY: {{ $server.auth.jwtSigningKey | b64enc | quote }}
  {{- else if or .Release.IsInstall (not $prevServerSecret) }}
  KITARU_SERVER_JWT_SIGNING_KEY: {{ randAlphaNum 32 | b64enc | quote }}
  {{- else }}
  KITARU_SERVER_JWT_SIGNING_KEY: {{ $prevServerSecret.data.KITARU_SERVER_JWT_SIGNING_KEY | default (randAlphaNum 32 | b64enc | quote) }}
  {{- end }}

  {{- $secretEnvVars := include "kitaru.storeSecretEnvVariables" . | fromYaml | default dict }}
  {{- $secretEnvVars = merge ($server.secretEnvironment | default dict) $secretEnvVars }}
  {{- range $k, $v := $secretEnvVars }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
{{- end -}}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "kitaru.fullname" . }}
  labels:
    {{- include "kitaru.labels" . | nindent 4 }}
{{ include "secret.content" . }}
---
{{- $server := include "kitaru.serverValues" . | fromYaml -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "kitaru.fullname" . }}-db-migration
  labels:
    {{- include "kitaru.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-3"  
    "helm.sh/hook-delete-policy": before-hook-creation{{ if not $server.debug }},hook-succeeded{{ end }}
{{ include "secret.content" . }}
