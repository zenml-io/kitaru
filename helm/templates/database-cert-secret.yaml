{{- $inlineCa := and .Values.server.database.sslCa .Values.server.database.sslCa.value -}}
{{- $inlineCert := and .Values.server.database.sslCert .Values.server.database.sslCert.value -}}
{{- $inlineKey := and .Values.server.database.sslKey .Values.server.database.sslKey.value -}}
{{- if or $inlineCa $inlineCert $inlineKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitaru.fullname" . }}-db-certs
  labels:
    {{- include "kitaru.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $inlineCa }}
  ca.pem: {{ .Values.server.database.sslCa.value | b64enc | quote }}
  {{- end }}
  {{- if $inlineCert }}
  client-cert.pem: {{ .Values.server.database.sslCert.value | b64enc | quote }}
  {{- end }}
  {{- if $inlineKey }}
  client-key.pem: {{ .Values.server.database.sslKey.value | b64enc | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitaru.fullname" . }}-db-certs-db-migration
  labels:
    {{- include "kitaru.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation{{ if not .Values.server.debug }},hook-succeeded{{ end }}
type: Opaque
data:
  {{- if $inlineCa }}
  ca.pem: {{ .Values.server.database.sslCa.value | b64enc | quote }}
  {{- end }}
  {{- if $inlineCert }}
  client-cert.pem: {{ .Values.server.database.sslCert.value | b64enc | quote }}
  {{- end }}
  {{- if $inlineKey }}
  client-key.pem: {{ .Values.server.database.sslKey.value | b64enc | quote }}
  {{- end }}
{{- end }}
