replicaCount: 1

image:
  repository: zenmldocker/kitaru
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

server:
  port: 8000
  environment: {}
  secretEnvironment: {}
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      memory: 600Mi

migration:
  enabled: true
  command:
    - python
    - -m
    - kitaru.server.database.main
  backoffLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

service:
  type: ClusterIP
  port: 80
  annotations: {}

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []

nodeSelector: {}
tolerations: []
affinity: {}

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 256Mi

volumeMounts:
  - name: tmp
    mountPath: /tmp
