#############################  Runtime  #############################

# Maximum number of retries before a link is declared dead
max_retries = 3

# Maximum number of concurrent link checks
max_concurrency = 14

#############################  Requests  ############################

# Timeout for each request
timeout = 30

# User agent for HTTP requests
user_agent = "lychee/kitaru-ci (https://github.com/zenml-io/kitaru)"

#############################  Exclusions  ##########################

# Skip private/internal IP ranges
exclude_all_private = true

# Don't check email addresses
include_mail = false

# URL patterns to exclude (regex)
exclude = [
    # Sites that block automated requests
    "^https://linkedin\\.com",
    "^https://www\\.linkedin\\.com",
    "^https://x\\.com",
    "^https://twitter\\.com",
    # Slack invite redirect returns 403 to bots/link-checkers
    "^https://(www\\.)?zenml\\.io/slack",
    # katacontainers.io refuses automated link-checker connections
    "^https://katacontainers\\.io",
]

# Paths to exclude from scanning.
# CHANGELOG.md preserves historical release links, and planning/review folders are
# internal agent scratch docs; stale links there should not block CI.
exclude_path = [
    ".venv",
    "CHANGELOG.md",
    "design",
    "docs/investigations",
    "docs/plans",
    "docs/reviews",
    "prompt-exports",
]

#############################  Checking  ############################

# Check URL fragments/anchors (e.g. #section-name).
# Lychee 0.24.0 changed this from a boolean to an enum: none | anchor-only |
# text-only | full. "anchor-only" preserves the pre-0.24.0 behavior.
include_fragments = "anchor-only"
