---
schema_version: 1
schema:
  statuses:
    - covered
    - planned
    - missing
    - help_only
    - import_contract
    - smoke_only
    - opt_in_extended
    - manual_only
    - not_applicable
  cost_classes: [none, low, medium, high]
explicit_exclusions:
  - examples/v2/mcp
  - examples/v2/mcp/.mcp.json.example
examples:
  - id: canonical-returns
    path: examples/canonical_example
    public_docs: [examples/README.md, docs/book/getting-started/examples.md]
    owner_area: trace import, evaluation, investigation, cohorts, and experiment replay
    coverage:
      deterministic_pytest:
        status: covered
        test_file: tests/test_canonical_example.py
        notes: provider-free contracts for the agent, checked-in traces, evaluator,
          investigation walkthrough, and replay
      local_smoke:
        status: covered
        command: KITARU_CANONICAL_E2E=1 KITARU_CANONICAL_SERVER_URL=http://127.0.0.1:8000
          KITARU_CANONICAL_API_KEY=local-development-worker uv run pytest -q tests/integration/test_canonical_example_e2e.py
        requires_server: true
        required_env: [KITARU_CANONICAL_SERVER_URL, KITARU_CANONICAL_API_KEY]
        timeout_seconds: 600
        notes: CI covers import, built-in evaluation, persisted investigation answers,
          cohort creation, evaluator registration, and provider-free replay.
      live_provider:
        status: manual_only
        provider: openai-langfuse
        required_env:
          - OPENAI_API_KEY
          - LANGFUSE_PUBLIC_KEY
          - LANGFUSE_SECRET_KEY
          - LANGFUSE_HOST
        timeout_seconds: 900
        cost_class: low
        command: cd examples/canonical_example && ./generate.sh
        waiver:
          reason: Trace generation makes paid model calls and writes to a user-selected
            Langfuse project.
          reviewer_action: Regenerate the traces manually when the agent or trace
            export changes.
    release_policy:
      required_when_changed: true
