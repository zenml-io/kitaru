---
# Audit-only map of public Kitaru example coverage.
#
# This file is not a runner. It records which public examples are documented,
# which deterministic tests or smoke checks exercise them, and which provider
# checks remain manual or opt-in. Passing the audit means this metadata is
# internally consistent and incomplete coverage has explicit waivers; it does
# not mean every example ran.
schema_version: 1
schema:
  statuses:
    - covered
    - planned
    - missing
    - help_only
    - import_contract
    - smoke_only
    - opt_in_extended
    - manual_only
    - not_applicable
  cost_classes: [none, low, medium, high]
  notes:
    path: Existing example file or directory represented by this entry.
    public_docs: Public docs or README pages that list the example.
    deterministic_pytest: Provider-free pytest coverage, usually with fakes.
    local_smoke: Local smoke-test coverage; commands are documented, not run by the
      audit.
    live_provider: Real provider coverage metadata for release/operator checks. weekly_workflow,
      local_release_smoke, and manual_command_available distinguish scheduled automation
      from local/manual command availability.
    waiver: Required for missing, planned, and manual_only coverage statuses; reason
      explains why automation is incomplete, and reviewer_action tells a release reviewer
      what to do if that example changed.
    release_policy: Whether changes in this area should prompt release evidence.
explicit_exclusions: []
examples:
  - id: basic-flow
    path: examples/features/basic_flow/first_working_flow.py
    public_docs: [examples/README.md, docs/book/getting-started/examples.md]
    owner_area: smallest durable flow
    coverage:
      deterministic_pytest:
        status: covered
        test_file: tests/test_phase5_example.py
      local_smoke:
        status: covered
        command: uv run python examples/features/basic_flow/first_working_flow.py
        requires_server: true
        timeout_seconds: 60
      live_provider:
        status: not_applicable
        required: false
    release_policy:
      required_when_changed: true
