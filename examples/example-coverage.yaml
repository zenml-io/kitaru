---
schema_version: 1
schema:
  statuses:
    - covered
    - planned
    - missing
    - help_only
    - import_contract
    - smoke_only
    - opt_in_extended
    - manual_only
    - not_applicable
  cost_classes: [none, low, medium, high]
explicit_exclusions:
  - examples/v2/mcp
  - examples/v2/mcp/.mcp.json.example
examples:
  - id: canonical-returns
    path: examples/canonical_example
    public_docs: [examples/README.md, docs/book/getting-started/examples.md]
    owner_area: trace import, evaluation, cohorts, and experiment replay
    coverage:
      deterministic_pytest:
        status: covered
        test_file: tests/test_canonical_example.py
      local_smoke:
        status: covered
        command: PYTHONPATH=. uv run pytest -q tests/test_canonical_example.py
        requires_server: false
        timeout_seconds: 60
      live_provider:
        status: manual_only
        provider: openai-langfuse
        required_env: [OPENAI_API_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LANGFUSE_HOST]
        timeout_seconds: 900
        cost_class: low
        command: cd examples/canonical_example && ./generate.sh
        waiver:
          reason: Trace generation makes paid model calls and writes to a user-selected Langfuse project.
          reviewer_action: Regenerate the traces manually when the agent or trace export changes.
    release_policy:
      required_when_changed: true
