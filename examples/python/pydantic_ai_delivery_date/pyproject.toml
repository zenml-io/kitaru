[project]
name = "kitaru-delivery-date-example"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["kitaru[cli,mcp,worker]>=0.27.1", "kitaru-pydantic-ai[openai]>=0.3.0", "pydantic-ai-slim[openai]>=2.14.1,<2.52"]

[project.optional-dependencies]
langfuse = ["langfuse>=4.14,<5", "kitaru-langfuse-importer>=0.1.0"]

[tool.uv]
package = false

[tool.uv.sources]
kitaru = { path = "../../..", editable = true }
kitaru-pydantic-ai = { path = "../../../plugins/packages/pydantic-ai", editable = true }
kitaru-langfuse-importer = { path = "../../../plugins/packages/langfuse-importer", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
