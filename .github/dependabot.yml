---
version: 2
# Two lockfiles in this repository are deliberately NOT listed below. Read
# this before adding one of them.
#
# examples/python/pydantic_ai_ticket_resolver/uv.lock is the public quickstart.
# Its README installs it with `uv sync --frozen`, so this lockfile is exactly
# what a new user gets. The release process refreshes it to the newest
# published Kitaru and then runs the frozen end-to-end check against PyPI (see
# the kitaru-release skill). CI's "Quickstart example end to end" job swaps in
# wheels built from the PR branch before it tests, so a green Dependabot PR
# would never have exercised the install the README tells users to run.
#
# plugins/tests/importers/fixtures/**/package-lock.json is test data that pins
# one Mastra release on purpose.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    labels: [dependencies]
    groups:
      all-actions:
        patterns: ['*']
    cooldown:
      default-days: 7
    target-branch: develop
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    labels: [dependencies]
    groups:
      # Grouped by blast radius, not by semver magnitude. What decides how a
      # bump PR must be tested is *where a failure would surface*, and a PR can
      # only have one testing story. Batching packages whose failures surface in
      # different places produces a PR that inherits the strictest verification
      # requirement while offering the weakest reviewability, so nothing moves.
      #
      # A CATCH-ALL GROUP MEANS "EVERYTHING", NOT "THE LEFTOVERS". Dependabot's
      # specificity rules do not rescue you here, and getting this wrong
      # duplicates packages across PRs rather than failing loudly.
      #
      # `dependency_belongs_to_more_specific_group?` opens with
      # `return false unless patterns&.any?`
      # (updater/lib/dependabot/updater/pattern_specificity_calculator.rb), so a
      # group with no `patterns` is never asked whether something else claims a
      # dependency. It short-circuits and keeps every one it matches. The
      # specificity score only ever strips a dependency out of a group that HAS
      # patterns.
      #
      # So `exclude-patterns` below is not an optimization. It is the ONLY thing
      # that removes a dependency from this catch-all. It must therefore list
      # every pattern claimed by every group above it. Add a pattern up there
      # and forget to exclude it down here, and that package ships in TWO PRs.
      #
      # Verified the hard way: an earlier revision excluded only the wildcard
      # families and trusted exact names to win on specificity. Dependabot
      # promptly opened #553 containing `openai`, `anthropic`, `mcp`,
      # `google-genai`, `ruff` and `ty` -- all of which were already in their own
      # group PRs. See dependabot/dependabot-core#14902 and #13665.

      # Failures surface in CI and nowhere else, so a green pipeline is the
      # complete verification. Safe to merge on green.
      dev-tooling:
        patterns:
          - ruff
          - ty
          - yamlfix
          - pip-audit
          - python-dotenv
          - pytest
          - pytest-randomly
          - pytest-clarity
          - pytest-xdist
          - pytest*
          - griffe
          - griffe-typingdoc
          - griffe*
        update-types:
          - minor
          - patch

      # Pricing-data updates affect cost estimates rather than provider runtime
      # behavior, so review and ship them independently from adapter SDK bumps.
      genai-prices:
        patterns:
          - genai-prices
        update-types:
          - minor
          - patch

      # Failures surface in a user's runtime, and our tests mock these SDKs, so
      # CI is structurally blind to them. Needs live provider runs before merge.
      # See `tests/_gemini_fake_sdk.py` for the sharpest example: it substitutes
      # a fake module tree, so the Gemini adapter's contract against the real
      # SDK is never exercised.
      adapters-and-llm-sdks:
        patterns:
          - openai
          - openai-agents
          - anthropic
          - claude-agent-sdk
          - google-genai
          - google-adk
          - mcp
          - pydantic-ai-slim
          - pydantic-ai*
          - langchain
          - langchain-openai
          - langchain-anthropic
          - langchain*
          - langgraph
          - langgraph*
        update-types:
          - minor
          - patch

      # The runtime Kitaru is built on. Bumps here move the floor under
      # everything else, so they get their own PR rather than being buried in a
      # multi-package diff.
      zenml:
        patterns:
          - zenml
        update-types:
          - minor
          - patch

      # Everything else: cyclopts, pydantic, rich, modal, typing-extensions.
      #
      # `exclude-patterns` MUST mirror every pattern from the four groups above.
      # This group has no `patterns`, so Dependabot never asks whether another
      # group claims a dependency (see the note at the top of `groups:`) and it
      # will happily re-ship anything not listed here in a second PR. Keep this
      # list in sync when you edit a group above.
      minor-and-patch:
        exclude-patterns:
          # mirrors dev-tooling
          - ruff
          - ty
          - yamlfix
          - pip-audit
          - python-dotenv
          - pytest*
          - griffe*
          # mirrors adapters-and-llm-sdks
          - openai
          - openai-agents
          - anthropic
          - claude-agent-sdk
          - google-genai
          - google-adk
          - mcp
          - pydantic-ai*
          - langchain*
          - langgraph*
          # mirrors genai-prices
          - genai-prices
          # mirrors zenml
          - zenml
        update-types:
          - minor
          - patch
    ignore:
      # griffe 2.x split the package into griffe / griffecli / griffelib.
      # Our SDK doc generator depends on fumapy (docs/node_modules/fumadocs-python)
      # which pins griffe<2.0.0. Until fumapy upstream supports griffe 2.x,
      # accepting a major bump here is a phantom upgrade — the lockfile would
      # claim 2.x but every real workflow either silently downgrades or breaks.
      - dependency-name: griffe
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    target-branch: develop
  # The plugins workspace (plugins/pyproject.toml, plugins/uv.lock) gets its own
  # block instead of joining the root block as `directories: ["/", "/plugins"]`.
  #
  # Settings such as `versioning-strategy` apply to a whole block, and only this
  # workspace needs `lockfile-only` (see below). A shared block would also let
  # every group PR span both lockfiles. A one-line root `mcp` patch would then
  # wait on the review of every plugin adapter SDK bump in the same PR.
  #
  # Nothing is lost by splitting the ruff and ty bumps. The root ruff config
  # excludes `plugins`, and the plugin-tests CI job checks plugins with the
  # plugins lockfile's own ruff and ty.
  - package-ecosystem: uv
    directory: /plugins
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    labels: [dependencies]
    # Every package under plugins/packages/ is published to PyPI. The upper
    # bound on each framework it wraps records the versions its adapter has
    # been verified against, and extending one is a deliberate change with its
    # own tests (#1091, #1092).
    #
    # Under the default strategy, Dependabot rewrites such a range itself as
    # soon as a release lands outside it. It has already done this to the root
    # pyproject.toml: #712 and #823 turned `>=2.14.1,<2.23` into
    # `>=2.23.0,<2.24` and then `>=2.27.1,<2.28`, raising the floor as well as
    # the ceiling. Merged into a plugin, that change makes the next
    # release refuse to install next to any older framework version it used to
    # support, and claim support for a version nobody tested.
    #
    # `lockfile-only` still moves plugins/uv.lock to the newest release inside
    # each range, so plugin-tests exercises it. It never edits a pyproject.toml.
    # The cost: a release outside a range produces no PR at all, so widening a
    # range stays a job for a human watching upstream.
    versioning-strategy: lockfile-only
    groups:
      # Same blast-radius grouping as the root `uv` block. Identifiers carry a
      # `plugins-` prefix so a PR title names the workspace it touches, and so
      # no branch name can collide with a root group of the same name.

      # Failures surface in CI and nowhere else, so a green pipeline is the
      # complete verification. Safe to merge on green.
      plugins-dev-tooling:
        patterns:
          - ruff
          - ty
          - pytest*
          - hypothesis
        update-types:
          - minor
          - patch

      # Mirrors the root `genai-prices` group: pricing data changes cost
      # estimates, not adapter behavior.
      plugins-genai-prices:
        patterns:
          - genai-prices
        update-types:
          - minor
          - patch

      # Mirrors the root `adapters-and-llm-sdks` group, plus `deepagents`, which
      # the LangGraph adapter supports as an extra. These plugins wrap the
      # frameworks, but CI runs them against fake models and has no provider
      # credentials, so it cannot see a behavior change that only shows up
      # against a real model. Needs live provider runs before merge.
      plugins-adapters-and-llm-sdks:
        patterns:
          - openai
          - openai-agents
          - anthropic
          - claude-agent-sdk
          - google-genai
          - google-adk
          - mcp
          - pydantic-ai*
          - langchain*
          - langgraph*
          - deepagents
        update-types:
          - minor
          - patch

      # The trace importers call these SDKs to fetch traces from a provider
      # account. Their tests run on fixtures and fakes with no credentials, so
      # CI proves the parsing but not the provider contract. Needs a real import
      # from each affected provider before merge.
      plugins-importer-sdks:
        patterns:
          - arize-phoenix-client
          - braintrust
          - langfuse
          - langsmith
          - logfire
        update-types:
          - minor
          - patch

      # Everything else: httpx, opentelemetry-api, opentelemetry-sdk.
      #
      # `exclude-patterns` MUST mirror every pattern from the four groups above,
      # for the reason documented at the top of the root block's `groups:`.
      plugins-minor-and-patch:
        exclude-patterns:
          # mirrors plugins-dev-tooling
          - ruff
          - ty
          - pytest*
          - hypothesis
          # mirrors plugins-genai-prices
          - genai-prices
          # mirrors plugins-adapters-and-llm-sdks
          - openai
          - openai-agents
          - anthropic
          - claude-agent-sdk
          - google-genai
          - google-adk
          - mcp
          - pydantic-ai*
          - langchain*
          - langgraph*
          - deepagents
          # mirrors plugins-importer-sdks
          - arize-phoenix-client
          - braintrust
          - langfuse
          - langsmith
          - logfire
        update-types:
          - minor
          - patch
    ignore:
      # Core Kitaru and every plugin resolve from this checkout through
      # `[tool.uv.sources]` (core by path, plugins as workspace members), never
      # from PyPI. Release preparation rewrites their pins by hand. `kitaru*`
      # matches `kitaru[server]` and every `kitaru-*` plugin.
      - dependency-name: "kitaru*"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    target-branch: develop
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    labels: [dependencies]
    groups:
      # The fumadocs packages must move in lockstep (fumadocs-core, -mdx, -ui
      # and -python are a coupled family), which is what this group is for.
      fumadocs:
        patterns:
          - "fumadocs-*"
      # `exclude-patterns` is what makes the group above actually work. Without
      # it the group only ever fires for MAJOR bumps, and every minor/patch
      # fumadocs bump is silently stolen by this catch-all.
      #
      # The reason is the same specificity trap documented in the `uv` block:
      # the contest only runs between groups eligible for that update type. A
      # major is not eligible for `minor-and-patch`, so `fumadocs` runs
      # unopposed and wins. A minor/patch IS eligible, and then `fumadocs-*`
      # (a wildcard, scoring ~94) loses to this pattern-less catch-all (500) and
      # the packages are stripped out of the group they were written for.
      #
      # That is why #555 is titled "minor-and-patch" while containing nothing
      # but fumadocs packages. See dependabot/dependabot-core#14902.
      minor-and-patch:
        exclude-patterns:
          - "fumadocs-*"
        update-types:
          - minor
          - patch
    ignore:
      # @takumi-rs/image-response 1.x is stricter about CSS shorthand parsing
      # and rejects `borderBottom: "8px dashed ..."`. fumadocs-ui 16.8.4's
      # default OG image template (used via fumadocs-ui/og/takumi) emits
      # exactly this shorthand, so the combo of fumadocs-ui 16.8+ and
      # takumi-rs 1.x crashes static OG image generation. Hold the takumi-rs
      # major bump until fumadocs-ui ships an OG template that uses longhand
      # styles (or until we replace fumadocs-ui's DefaultImage with a custom
      # template).
      - dependency-name: "@takumi-rs/image-response"
        update-types: ["version-update:semver-major"]
      # fumadocs-python 1.x rewrote the convert()/write() API that
      # docs/scripts/convert-sdk-docs.mjs and scripts/generate_sdk_docs.py are
      # built on (write() takes a string outDir, convert() returns
      # {path,title,content}, root-prefix stripping is gone). Taking the major
      # breaks the "Convert SDK reference to MDX" step of docs.yml. Hold it
      # until the generator is migrated; see #1161 and remove this entry then.
      - dependency-name: fumadocs-python
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    target-branch: develop
  # The root pnpm workspace: the TypeScript SDK and adapters published to npm
  # (packages/*) plus the three workspace examples. From `/`, Dependabot reads
  # pnpm-workspace.yaml and updates every member's package.json together with
  # the single root pnpm-lock.yaml. The CI `typescript` job tests all of it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    labels: [dependencies]
    groups:
      # Grouped by blast radius, like the root `uv` block. Identifiers carry a
      # prefix or a framework name so no branch name can collide with the /docs
      # groups.

      # Failures surface in CI (`pnpm run lint`, `typecheck`, `test:built`,
      # `generate:check`) and nowhere else. Safe to merge on green.
      typescript-dev-tooling:
        patterns:
          - "@biomejs/biome"
          - "@types/node"
          - openapi-typescript
          - typescript
          - vitest
        update-types:
          - minor
          - patch

      # The two groups below each hold the framework behind one published
      # adapter's `peerDependencies`. Dependabot never edits
      # `peerDependencies` (the npm file parser reads only `dependencies`,
      # `devDependencies` and `optionalDependencies`), so the published range
      # stays put while the devDependency pin that CI tests moves.
      #
      # When a PR moves that pin past the peer ceiling, CI then tests a version
      # users are told is unsupported. Treat that PR as the prompt for a
      # deliberate range extension like #1092, not something to merge as is.
      # Separate groups keep a Mastra range question from holding up an `ai`
      # patch.
      vercel-ai:
        patterns:
          - ai
          - "@ai-sdk/*"
        update-types:
          - minor
          - patch

      # `zod` is declared only by the Mastra adapter and its example, where it
      # defines the tool schemas Mastra validates.
      mastra:
        patterns:
          - "@mastra/*"
          - zod
        update-types:
          - minor
          - patch

      # Everything else. Empty today, so this group exists to stop the next
      # new dependency arriving as a one-package PR.
      #
      # `exclude-patterns` MUST mirror every pattern from the three groups
      # above, for the reason documented at the top of the root `uv` block's
      # `groups:`.
      typescript-minor-and-patch:
        exclude-patterns:
          # mirrors typescript-dev-tooling
          - "@biomejs/biome"
          - "@types/node"
          - openapi-typescript
          - typescript
          - vitest
          # mirrors vercel-ai
          - ai
          - "@ai-sdk/*"
          # mirrors mastra
          - "@mastra/*"
          - zod
        update-types:
          - minor
          - patch
    ignore:
      # Every package supports Node 22 and 26, but the release/build gate reads
      # Node 22 from .node-version. Keep the Node type definitions on 22.x so
      # package builds do not accidentally depend on APIs absent from Node 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    target-branch: develop
