---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    reviewers: [strickvl]
    labels: [dependencies]
    groups:
      all-actions:
        patterns: ['*']
    cooldown:
      default-days: 7
    target-branch: develop
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    reviewers: [strickvl]
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # griffe 2.x split the package into griffe / griffecli / griffelib.
      # Our SDK doc generator depends on fumapy (docs/node_modules/fumadocs-python)
      # which pins griffe<2.0.0. Until fumapy upstream supports griffe 2.x,
      # accepting a major bump here is a phantom upgrade — the lockfile would
      # claim 2.x but every real workflow either silently downgrades or breaks.
      - dependency-name: griffe
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    target-branch: develop
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    reviewers: [strickvl]
    labels: [dependencies]
    groups:
      fumadocs:
        patterns:
          - "fumadocs-*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    target-branch: develop
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    reviewers: [strickvl]
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    target-branch: develop
