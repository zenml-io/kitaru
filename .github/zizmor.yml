---
# Kitaru's zizmor policy:
# - Fix GitHub Actions security findings whenever practical.
# - Keep this file limited to narrow, documented exceptions.
# - Do not copy broad suppressions from the larger ZenML monorepo config.
rules:
  # dangerous-triggers: docs.yml uses pull_request_target only for preview
  # cleanup on closed/drafted same-repo PRs. The cleanup job does not checkout
  # or run PR-controlled code; it only deletes a deterministic Worker name.
  dangerous-triggers:
    ignore: [docs.yml:3]
  # self-repository: zizmor v1.30 wants `uses: $/...` for same-repo actions,
  # but actionlint (through v1.7.12, run by `just check` and CI) rejects that
  # syntax, so release.yml keeps `./`. The job checks out the workflow's own
  # ref, so both spellings resolve to the same commit. File-scoped rather than
  # line-pinned: unrelated edits to release.yml shift line numbers and would
  # silently un-suppress the finding. Drop this exception and switch to `$/`
  # once actionlint understands it (rhysd/actionlint#711).
  self-repository:
    ignore: [release.yml]
