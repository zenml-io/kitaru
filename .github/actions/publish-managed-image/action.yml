---
name: Publish managed Kitaru image
description: Build and publish the managed Kitaru image to Amazon ECR.
inputs:
  version:
    description: Kitaru release version.
    required: true
  dry-run:
    description: Build and scan the image without publishing it.
    required: false
    default: 'false'
  aws-role-arn:
    description: AWS role used to publish the image.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      if: inputs.dry-run != 'true'
      uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d  # v6.2.2
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: eu-central-1
    - name: Login to private Amazon ECR
      if: inputs.dry-run != 'true'
      uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6
      with:
        mask-password: 'true'
    - name: Build and publish image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: .
        file: docker/release.Dockerfile
        target: runtime
        load: ${{ inputs.dry-run == 'true' }}
        push: ${{ inputs.dry-run != 'true' }}
        build-args: |
          ${{ inputs.dry-run != 'true' && format('KITARU_VERSION={0}', inputs.version) || '' }}
        tags: 715803424590.dkr.ecr.eu-central-1.amazonaws.com/kitaru-pro-server:${{ inputs.version }}
        labels: |
          org.opencontainers.image.title=kitaru
          org.opencontainers.image.description=Kitaru server
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.source=https://github.com/zenml-io/kitaru
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=Apache-2.0
