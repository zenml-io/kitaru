---
name: Publish managed Kitaru images
description: Build and publish the managed Kitaru images to Amazon ECR.
inputs:
  package-version:
    description: Published Kitaru Python package version.
    required: true
  image-tag:
    description: Managed image tag.
    required: true
  dry-run:
    description: Validate the Dockerfiles without publishing images.
    required: false
    default: 'false'
  aws-role-arn:
    description: AWS role used to publish the images.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      if: inputs.dry-run != 'true'
      uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d  # v6.2.2
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: eu-central-1
    - name: Login to private Amazon ECR
      if: inputs.dry-run != 'true'
      uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6
      with:
        mask-password: 'true'
    - name: Validate image Dockerfiles
      if: inputs.dry-run == 'true'
      shell: bash
      run: |
        docker build --check -f docker/release-server.Dockerfile .
        docker build --check -f docker/onboarding-sandbox.Dockerfile .
    - name: Build and publish server image
      if: inputs.dry-run != 'true'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: .
        file: docker/release-server.Dockerfile
        target: server
        push: true
        build-args: |
          KITARU_VERSION=${{ inputs.package-version }}
        tags: 715803424590.dkr.ecr.eu-central-1.amazonaws.com/kitaru-pro-server:${{ inputs.image-tag }}
        labels: |
          org.opencontainers.image.title=kitaru
          org.opencontainers.image.description=Kitaru server
          org.opencontainers.image.version=${{ inputs.image-tag }}
          org.opencontainers.image.source=https://github.com/zenml-io/kitaru
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=Apache-2.0
    - name: Build and publish onboarding sandbox image
      if: inputs.dry-run != 'true'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: .
        file: docker/onboarding-sandbox.Dockerfile
        target: worker
        push: true
        build-args: |
          BASE_IMAGE=zenmldocker/kitaru-worker:${{ inputs.image-tag }}
        tags: 715803424590.dkr.ecr.eu-central-1.amazonaws.com/kitaru-onboarding-sandbox:${{ inputs.image-tag }}
        labels: |-
          org.opencontainers.image.title=kitaru-onboarding-sandbox
          org.opencontainers.image.description=Kitaru onboarding sandbox
          org.opencontainers.image.version=${{ inputs.image-tag }}
          org.opencontainers.image.source=https://github.com/zenml-io/kitaru
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=Apache-2.0
