---
name: Installer smoke
# Runs install.sh on real GitHub-hosted runners, then checks the CLI, MCP
# server, skills, and PATH. PRs install the local wheel so CI does not inflate
# PyPI download counts. Releases fetch the published package as a user would.
# No Docker on the runners, so login is skipped.
# Triggers: PRs that touch the script (path-filtered, so this does not run on
# ordinary PRs), manual dispatch, and the release workflow right after the
# package is published, to prove the one-liner installs the new version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Kitaru version the installer must produce (empty = latest)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Kitaru version the installer must produce (empty = latest)
        required: false
        type: string
      source:
        description: >-
          Where to get install.sh from: "file" runs the checked-out script
          (PRs); "url" fetches https://kitaru.ai/install, the exact bytes users
          run (release).
        required: false
        type: string
        default: file
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [install.sh, .github/workflows/installer.yml]
permissions: {}
concurrency:
  group: installer-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    steps:
      # Temporary: remove the repair when both macOS images reject these chains
      # without it. Keep the behavioral checks to catch stale runner images.
      # https://github.com/actions/runner-images/issues/15228
      - name: Repair macOS certificate bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - /etc/ssl/cert.pem \
            /opt/homebrew/etc/ca-certificates/cert.pem \
            /usr/local/etc/ca-certificates/cert.pem <<'PY'
          import base64
          import hashlib
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          # SHA-256 certificate fingerprints from the incident's root inventory:
          # https://emudhra.we-have-a-problem.com/roots.json
          blocked = {
              "86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B",  # emSign ECC Root CA - G3
              "D7A7A0FB5D7E2731D771E9484EBCDEF71D5F0C3E0A2948782BC83EE0EA699EF4",  # AAA Certificate Services
              "7DD78D5F4F13459A83DFF9ABBBA62EDBAF6F2D102BF257FD712F4D9F2746ED8D",  # emSign Root TLS CA - G3
              "F2EDAAFF3D9B701FB4D14C9F285F8C0BAD90FC3BCC1FA07D47F4718EDABA34A5",  # emSign Root CS CA - G3
          }
          for index, name in enumerate(sys.argv[1:]):
              path = Path(name)
              if index and not path.exists():
                  continue
              certificates = re.findall(
                  rb"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----",
                  path.read_bytes(), re.DOTALL,
              )
              retained = []
              for certificate in certificates:
                  der = base64.b64decode(b"".join(certificate.splitlines()[1:-1]), validate=True)
                  if hashlib.sha256(der).hexdigest().upper() not in blocked:
                      retained.append(certificate)
              if not retained:
                  raise SystemExit(f"Refusing to install an empty CA bundle: {path}")
              with tempfile.NamedTemporaryFile() as output:
                  output.write(b"\n".join(retained) + b"\n")
                  output.flush()
                  subprocess.run(
                      ["/usr/bin/openssl", "crl2pkcs7", "-nocrl", "-certfile", output.name],
                      check=True, stdout=subprocess.DEVNULL,
                  )
                  if len(retained) != len(certificates):
                      subprocess.run(
                          ["sudo", "install", "-m", "0644", "-o", "root", "-g", "wheel",
                           output.name, str(path.resolve())], check=True,
                      )
              print(f"{path}: removed {len(certificates) - len(retained)} roots; retained {len(retained)}")
          PY
          mkdir -p "$RUNNER_TEMP/kitaru-empty-certs"
          # Apple LibreSSL otherwise falls back to stale Keychain trust on Intel.
          # https://github.com/galadran/we-have-a-problem.com/issues/65
          {
            echo 'OPENSSL_X509_TEA_DISABLE=1'
            echo 'CURL_CA_BUNDLE=/etc/ssl/cert.pem'
            echo 'SSL_CERT_FILE=/etc/ssl/cert.pem'
            echo "SSL_CERT_DIR=$RUNNER_TEMP/kitaru-empty-certs"
            echo 'GIT_SSL_CAINFO=/etc/ssl/cert.pem'
            echo "GIT_SSL_CAPATH=$RUNNER_TEMP/kitaru-empty-certs"
            echo 'PIP_CERT=/etc/ssl/cert.pem'
          } >> "$GITHUB_ENV"
      - name: Verify macOS curl and Git certificate rejection
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 <<'PY'
          import re
          import shutil
          import subprocess
          hosts = (
              "dv-g3b-emudhra.we-have-a-problem.com",
              "dv-g3b-aaa-emudhra.we-have-a-problem.com",
              "dv-g3b-noct-emudhra.we-have-a-problem.com",
              "dv-g3b-aaa-noct-emudhra.we-have-a-problem.com",
          )
          for executable in dict.fromkeys(("/usr/bin/curl", shutil.which("curl"))):
              if executable is None:
                  raise SystemExit("curl is missing from PATH")
              command = [executable, "-fsSL", "--connect-timeout", "15", "--max-time", "30", "-o", "/dev/null"]
              for url in ("https://github.com/", "https://kitaru.ai/install", "https://astral.sh/uv/install.sh", "https://pypi.org/simple/kitaru/"):
                  subprocess.run([*command, url], check=True, timeout=45)
              for host in hosts:
                  result = subprocess.run([*command, f"https://{host}/"], capture_output=True, text=True, timeout=45)
                  if result.returncode != 60:
                      raise SystemExit(f"{executable} must reject {host} with certificate error 60; got {result.returncode}: {result.stderr}")
                  print(f"{executable}: rejected {host} with certificate error 60")
          subprocess.run(
              ["git", "ls-remote", "https://github.com/actions/checkout.git", "HEAD"],
              check=True, timeout=45,
          )
          result = subprocess.run(
              ["git", "ls-remote", "https://git-emudhra.we-have-a-problem.com/check.git"],
              capture_output=True, text=True, timeout=45,
          )
          if result.returncode != 128 or not re.search(
              r"SSL certificate problem|certificate verify failed|server certificate verification failed|certificate.*revoked",
              result.stderr, re.IGNORECASE,
          ):
              raise SystemExit(f"Git must reject the compromised chain with a certificate error; got {result.returncode}: {result.stderr}")
          print("Git: rejected the compromised chain with a certificate error")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        if: github.event_name == 'pull_request' || runner.os == 'macOS'
      - name: Verify macOS uv certificate rejection
        if: runner.os == 'macOS'
        shell: bash
        env:
          UV_HTTP_TIMEOUT: '15'
          UV_HTTP_RETRIES: '0'
        run: |
          set -euo pipefail
          /usr/bin/python3 <<'PY'
          import re
          import subprocess
          version = subprocess.check_output(["uv", "--version"], text=True).split()[1]
          if tuple(map(int, version.split("."))) < (0, 13, 5):
              raise SystemExit(f"uv >= 0.13.5 is required; found {version}")
          command = [
              "uv", "pip", "compile", "--no-config", "--no-cache", "--no-deps", "--no-build",
              "--python", "/usr/bin/python3", "-", "--index-url",
          ]
          subprocess.run(
              [*command, "https://pypi.org/simple/"], input="idna\n", text=True,
              check=True, timeout=45, stdout=subprocess.DEVNULL,
          )
          for host in ("dv-g3b-emudhra.we-have-a-problem.com", "dv-g3b-aaa-emudhra.we-have-a-problem.com"):
              result = subprocess.run(
                  [*command, f"https://{host}/"], input="idna\n", text=True,
                  capture_output=True, timeout=45,
              )
              if result.returncode == 0 or not re.search(
                  r"invalid peer certificate|certificate verify failed|certificate verification failed",
                  result.stderr, re.IGNORECASE,
              ):
                  raise SystemExit(f"uv must reject {host} with a certificate error; got {result.returncode}: {result.stderr}")
              print(f"uv: rejected {host} with a certificate error")
          PY
      - name: Build local Kitaru wheel
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          wheel_dir="$RUNNER_TEMP/kitaru-wheel"
          uv build --wheel --out-dir "$wheel_dir"
          wheel=$(find "$wheel_dir" -maxdepth 1 -name 'kitaru-*.whl' -print -quit)
          wheel_uri=$(python -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())' "$wheel")
          printf 'kitaru @ %s\n' "$wheel_uri" > "$RUNNER_TEMP/kitaru-constraint.txt"
          {
            printf 'KITARU_VERSION=%s\n' "$(uv version --short)"
            printf 'UV_CONSTRAINT=%s\n' "$RUNNER_TEMP/kitaru-constraint.txt"
            printf 'UV_TOOL_BIN_DIR=%s\n' "$(env -u UV_TOOL_BIN_DIR uv tool dir --bin)"
          } >> "$GITHUB_ENV"
      - name: Select published Kitaru version
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: printf 'KITARU_VERSION=%s\n' "$REQUESTED_VERSION" >> "$GITHUB_ENV"
      - name: Run the installer as a user would
        shell: bash
        env:
          SOURCE: ${{ inputs.source || 'file' }}
        # The default (non-verbose) path is the one users run, so that is the
        # path that has to pass. On failure, rerun once with --verbose purely to
        # print diagnostics; the step still fails. The retry loop is for PyPI
        # lagging a publish by a few seconds.
        run: |
          get_script() {
            if [ "$SOURCE" = "url" ]; then curl -fsSL https://kitaru.ai/install; else cat "$GITHUB_WORKSPACE/install.sh"; fi
          }
          # Run from an empty directory: the checkout is itself a Python project,
          # which would put the installer into project mode.
          cd "$(mktemp -d)"
          for attempt in 1 2 3 4 5; do
            get_script | bash -s -- && exit 0
            echo "installer attempt $attempt failed; retrying in 30s" >&2
            sleep 30
          done
          echo "::group::verbose rerun for diagnostics"
          get_script | bash -s -- --verbose || true
          echo "::endgroup::"
          exit 1
      - name: Verify
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          uname -a
          kitaru --version
          if [ -n "$KITARU_VERSION" ]; then
            test "$(kitaru --version)" = "$KITARU_VERSION"
          fi
          kitaru-mcp --help >/dev/null
          ls "$HOME/.agents/skills"
          test -f "$HOME/.agents/skills/kitaru-investigation/SKILL.md"
          kitaru doctor > doctor.json || true
          python3 -c "import json; d=json.load(open('doctor.json'))['item']['checks']; [print(c['name'], c['status'], c.get('detail','')[:80]) for c in d]" \
            || cat doctor.json
          # `set -o pipefail` above would fail the pipe on a missing rc file, so
          # swallow cat's status and let grep decide.
          { cat "$HOME/.bashrc" "$HOME/.zshrc" "$HOME/.profile" "$HOME/.bash_profile" 2>/dev/null || true; } \
            | grep -q ".local/bin" || { echo "PATH not persisted"; exit 1; }
      - name: Re-run is an upgrade, not an error
        shell: bash
        run: cd "$(mktemp -d)" && cat "$GITHUB_WORKSPACE/install.sh" | bash -s --
          --no-skills --no-mcp --quiet
      - name: Inside a project, install into that project's environment
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cd "$(mktemp -d)"
          uv init --quiet -p 3.12 --name demo-agent .
          cat "$GITHUB_WORKSPACE/install.sh" | bash -s -- --no-skills --no-mcp
          grep -q 'kitaru\[cli,mcp,worker\]' pyproject.toml
          uv run kitaru --version
          uv run kitaru-mcp --help >/dev/null
      - name: A failed install must exit nonzero (quiet path)
        shell: bash
        # Regression for the status-swallowing bug in `quiet`: an impossible
        # version pin makes `uv tool install` fail, and that must surface.
        run: |-
          cd "$(mktemp -d)"
          if cat "$GITHUB_WORKSPACE/install.sh" | bash -s -- --no-skills --no-mcp --version=99.99.99; then
            echo "installer exited 0 on a failed install" >&2; exit 1
          fi
          echo "failed install correctly exited nonzero"
