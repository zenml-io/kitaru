---
name: Installer smoke
# Runs install.sh on real GitHub-hosted runners the way a user would
# (`curl ... | bash`), then checks the CLI, MCP server, skills, and PATH.
# No Docker on the runners, so login is skipped.
# Triggers: PRs that touch the script (path-filtered, so this does not run on
# ordinary PRs), manual dispatch, and the release workflow right after the
# package is published, to prove the one-liner installs the new version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Kitaru version the installer must produce (empty = latest)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Kitaru version the installer must produce (empty = latest)
        required: false
        type: string
      source:
        description: >-
          Where to get install.sh from: "file" runs the checked-out script
          (PRs); "url" fetches https://kitaru.ai/install, the exact bytes users
          run (release).
        required: false
        type: string
        default: file
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [install.sh, .github/workflows/installer.yml]
permissions: {}
concurrency:
  group: installer-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run the installer as a user would
        shell: bash
        env:
          KITARU_VERSION: ${{ inputs.version }}
          SOURCE: ${{ inputs.source || 'file' }}
        # The default (non-verbose) path is the one users run, so that is the
        # path that has to pass. On failure, rerun once with --verbose purely to
        # print diagnostics; the step still fails. The retry loop is for PyPI
        # lagging a publish by a few seconds.
        run: |
          get_script() {
            if [ "$SOURCE" = "url" ]; then curl -fsSL https://kitaru.ai/install; else cat install.sh; fi
          }
          for attempt in 1 2 3 4 5; do
            get_script | bash -s -- && exit 0
            echo "installer attempt $attempt failed; retrying in 30s" >&2
            sleep 30
          done
          echo "::group::verbose rerun for diagnostics"
          get_script | bash -s -- --verbose || true
          echo "::endgroup::"
          exit 1
      - name: Verify
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          uname -a
          kitaru --version
          if [ -n "$EXPECTED_VERSION" ]; then
            test "$(kitaru --version)" = "$EXPECTED_VERSION"
          fi
          kitaru-mcp --help >/dev/null
          ls "$HOME/.agents/skills"
          test -f "$HOME/.agents/skills/kitaru-investigation/SKILL.md"
          kitaru doctor > doctor.json || true
          python3 -c "import json; d=json.load(open('doctor.json'))['item']['checks']; [print(c['name'], c['status'], c.get('detail','')[:80]) for c in d]" \
            || cat doctor.json
          # `set -o pipefail` above would fail the pipe on a missing rc file, so
          # swallow cat's status and let grep decide.
          { cat "$HOME/.bashrc" "$HOME/.zshrc" "$HOME/.profile" "$HOME/.bash_profile" 2>/dev/null || true; } \
            | grep -q ".local/bin" || { echo "PATH not persisted"; exit 1; }
      - name: Re-run is an upgrade, not an error
        shell: bash
        run: cat install.sh | bash -s -- --no-skills --no-mcp --quiet
      - name: Inside a project, install into that project's environment
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir demo-agent && cd demo-agent
          uv init --quiet -p 3.12 --name demo-agent .
          cat ../install.sh | bash -s -- --no-skills --no-mcp
          grep -q 'kitaru\[cli,mcp,worker\]' pyproject.toml
          uv run kitaru --version
          uv run kitaru-mcp --help >/dev/null
      - name: A failed install must exit nonzero (quiet path)
        shell: bash
        # Regression for the status-swallowing bug in `quiet`: an impossible
        # version pin makes `uv tool install` fail, and that must surface.
        run: |-
          if cat install.sh | bash -s -- --no-skills --no-mcp --version=99.99.99; then
            echo "installer exited 0 on a failed install" >&2; exit 1
          fi
          echo "failed install correctly exited nonzero"
