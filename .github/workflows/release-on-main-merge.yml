---
name: Release merged packages
on:
  pull_request_target:
    branches: [main]
    types: [closed]
permissions:
  contents: read
concurrency:
  group: release-main-merge
  cancel-in-progress: false
jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Create validated release plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' \
            | jq -R -s 'split("\n") | map(select(length > 0))' \
            > changed-paths.json
          uv run --no-sync python scripts/release_plan.py \
            --base "$BASE_SHA" \
            --head "$MERGE_SHA" \
            --labels "$PR_LABELS" \
            --paths-json "$(cat changed-paths.json)" \
            --require-version-bumps \
            --output json \
            > release-plan.json
          jq . release-plan.json
          if jq -e '.packages[] | select(.next_version != null)' \
            release-plan.json >/dev/null; then
            echo 'has_releases=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_releases=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Create plugin release tags
        if: steps.plan.outputs.has_releases == 'true'
        env:
          RELEASE_GIT_TOKEN: ${{ secrets.RELEASE_GIT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_GIT_TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          authenticated_remote="https://x-access-token:${RELEASE_GIT_TOKEN}@github.com/${GH_REPO}.git"
          jq -c '.packages[] | select(.unit != "core" and .next_version != null)' \
            release-plan.json \
            | while read -r package; do
                unit=$(jq -r '.unit' <<<"$package")
                version=$(jq -r '.next_version' <<<"$package")
                tag="$unit-v$version"
                existing_sha=$(git rev-list -n 1 "$tag" 2>/dev/null || true)
                if [ -n "$existing_sha" ] && [ "$existing_sha" != "$RELEASE_SHA" ]; then
                  echo "::error::$tag exists at $existing_sha, expected $RELEASE_SHA"
                  exit 1
                fi
                if [ -z "$existing_sha" ]; then
                  git tag -a "$tag" "$RELEASE_SHA" -m "$tag"
                  git push "$authenticated_remote" "refs/tags/$tag"
                fi
              done
      - name: Check whether core is included
        id: core
        run: |
          if jq -e '.packages[] | select(.unit == "core" and .next_version != null)' \
            release-plan.json >/dev/null; then
            echo 'included=true' >> "$GITHUB_OUTPUT"
          else
            echo 'included=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for coordinated plugin publications
        if: steps.core.outputs.included == 'true'
        run: |
          set -euo pipefail
          jq -c '.packages[] | select(.unit != "core" and .next_version != null)' \
            release-plan.json \
            | while read -r package; do
                distribution=$(jq -r '.distribution' <<<"$package")
                version=$(jq -r '.next_version' <<<"$package")
                for attempt in $(seq 1 120); do
                  if curl -fsS \
                    "https://pypi.org/pypi/$distribution/$version/json" \
                    >/dev/null 2>&1; then
                    break
                  fi
                  if [ "$attempt" = 120 ]; then
                    echo "::error::$distribution==$version was not published within 30 minutes"
                    exit 1
                  fi
                  sleep 15
                done
              done
      - name: Create core release tag
        if: steps.core.outputs.included == 'true'
        env:
          RELEASE_GIT_TOKEN: ${{ secrets.RELEASE_GIT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |-
          set -euo pipefail
          version=$(jq -r '.packages[] | select(.unit == "core") | .next_version' \
            release-plan.json)
          tag="v$version"
          existing_sha=$(git rev-list -n 1 "$tag" 2>/dev/null || true)
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$RELEASE_SHA" ]; then
            echo "::error::$tag exists at $existing_sha, expected $RELEASE_SHA"
            exit 1
          fi
          if [ -z "$existing_sha" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            authenticated_remote="https://x-access-token:${RELEASE_GIT_TOKEN}@github.com/${GH_REPO}.git"
            git tag -a "$tag" "$RELEASE_SHA" -m "$tag"
            git push "$authenticated_remote" "refs/tags/$tag"
          fi
