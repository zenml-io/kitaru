---
name: Fuzz nightly
on:
  schedule:
    - cron: 0 3 * * *
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Stateless properties use the 2000-example nightly profile. Database-backed
    # state machines use bounded recipe defaults; the limit only catches a wedged run.
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: importers
            sync-command: uv sync --project plugins --frozen --all-packages
            recipe: fuzz-importers
          - name: evaluators
            sync-command: uv sync --project plugins --frozen --all-packages
            recipe: fuzz-evaluators
          - name: api-models
            sync-command: uv sync --frozen --extra server
            recipe: fuzz-api-models
          - name: mcp
            sync-command: uv sync --frozen --extra server --extra cli --extra mcp
            recipe: fuzz-mcp
          - name: adapters
            sync-command: uv sync --project plugins --frozen --all-packages
            recipe: fuzz-adapters
          - name: filters
            sync-command: uv sync --frozen --extra server
            recipe: fuzz-filters
          - name: filters-pg
            sync-command: uv sync --frozen --extra server
            recipe: fuzz-filters-pg
            needs-db: true
          - name: api
            sync-command: uv sync --frozen --extra server --group fuzz
            recipe: fuzz-api
            needs-db: true
          - name: api-sequences
            sync-command: uv sync --frozen --extra server --group fuzz
            recipe: fuzz-api-sequences
            needs-db: true
          - name: task-lifecycle
            sync-command: uv sync --frozen --extra server --group fuzz
            recipe: fuzz-task-lifecycle
            needs-db: true
    name: fuzz (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
      - name: Sync dependencies
        env:
          SYNC_COMMAND: ${{ matrix.sync-command }}
        run: $SYNC_COMMAND
      # Database-backed fuzz runs use the PostgreSQL service expected on port
      # 5433. Compose owns that port mapping.
      - name: Start PostgreSQL
        if: matrix.needs-db
        run: |-
          docker compose up -d db
          for _ in $(seq 1 60); do
            if docker compose exec -T db pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: Restore Hypothesis database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .hypothesis/
          key: hypothesis-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt
            }}
          restore-keys: hypothesis-${{ matrix.name }}-
      - name: Run fuzz recipe
        id: fuzz
        env:
          HYPOTHESIS_PROFILE: nightly
          KITARU_FUZZ_RANDOM: '1'
          RECIPE: ${{ matrix.recipe }}
        run: uvx --from rust-just just "$RECIPE"
      - name: Save Hypothesis database
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .hypothesis/
          key: hypothesis-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt
            }}
      - name: Upload failing examples
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hypothesis-examples-${{ matrix.name }}
          path: .hypothesis/examples
          include-hidden-files: true
          if-no-files-found: error
      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SURFACE: ${{ matrix.name }}
        run: |-
          run_url="${REPO_URL}/actions/runs/${RUN_ID}"
          expected_title="Nightly fuzz run failed (${SURFACE})"
          issue_titles=$(gh issue list --label fuzz-nightly --state open --search "in:title ${SURFACE}" --json title --jq '.[].title')
          existing=0
          while IFS= read -r issue_title; do
            if [ "$issue_title" = "$expected_title" ]; then
              existing=1
              break
            fi
          done <<< "$issue_titles"
          if [ "$existing" = "0" ]; then
            gh issue create --label fuzz-nightly \
              --title "$expected_title" \
              --body "Run: ${run_url}. Download the hypothesis-examples-${SURFACE} artifact into .hypothesis/examples and rerun \`just fuzz-${SURFACE}\` to replay."
          fi
