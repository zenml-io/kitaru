---
name: LLM integration
run-name: >-
  LLM integration · ${{ github.event_name == 'workflow_dispatch' && inputs.kitaru_ref || 'develop' }}
  ·
  ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'provider-core' }}
on:
  schedule:
    # Monday 10:00 Amsterdam in CEST / 09:00 in CET. GitHub cron is UTC and does not follow Europe/Amsterdam daylight saving time.
    - cron: 0 8 * * 1
  workflow_dispatch:
    inputs:
      kitaru_ref:
        description: Kitaru git ref or SHA to test
        required: false
        type: string
        default: develop
      suite:
        description: Live provider suite to run
        required: true
        type: choice
        default: provider-core
        options: [provider-core, provider-extended]
      include_openai:
        description: Include OpenAI live checks
        required: false
        type: boolean
        default: true
      include_anthropic:
        description: Include Anthropic/Claude live checks
        required: false
        type: boolean
        default: true
      include_google_adk:
        description: Include the isolated Google ADK/Gemini live check
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: >-
    llm-integration-${{ github.event_name == 'workflow_dispatch' && inputs.kitaru_ref || 'develop' }}-${{
    github.event_name == 'workflow_dispatch' && inputs.suite || 'provider-core' }}
  cancel-in-progress: false
env:
  KITARU_ANALYTICS_OPT_IN: false
  ZENML_ANALYTICS_OPT_IN: false
  ZENML_LOGGING_VERBOSITY: INFO
  AUTO_OPEN_DASHBOARD: false
  ZENML_ENABLE_RICH_TRACEBACK: false
  PYTHONIOENCODING: utf-8
  UV_HTTP_TIMEOUT: 600
jobs:
  live-provider-checks:
    name: Run selected live provider checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: live-provider-tests
    outputs:
      fail_count: ${{ steps.summarize.outputs.fail_count }}
      failed_checks: ${{ steps.summarize.outputs.failed_checks }}
      tested_ref: ${{ steps.identity.outputs.tested_ref }}
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      suite: ${{ steps.plan.outputs.suite }}
      providers: ${{ steps.plan.outputs.providers }}
    steps:
      - name: Checkout trusted workflow ref
        id: checkout_workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - name: Trust-check requested Kitaru ref
        id: trust
        working-directory: trusted
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_KITARU_REF: ${{ inputs.kitaru_ref }}
        run: |
          set -euo pipefail
          requested_ref="${INPUT_KITARU_REF:-develop}"
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            requested_ref="develop"
          fi
          printf 'requested_ref=%s\n' "$requested_ref" >> "$GITHUB_OUTPUT"
          trust_ref() {
            printf 'trusted=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          reject_ref() {
            printf 'trusted=false\n' >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }
          git fetch --force --prune --no-tags origin \
            '+refs/heads/develop:refs/remotes/origin/develop' \
            '+refs/heads/release/*:refs/remotes/origin/release/*' \
            '+refs/tags/v*:refs/tags/v*'
          case "$requested_ref" in
            develop|refs/heads/develop)
              git show-ref --verify --quiet refs/remotes/origin/develop \
                || reject_ref "Trusted branch 'develop' was not found."
              selected_sha=$(git rev-parse 'refs/remotes/origin/develop^{commit}')
              printf 'selected_ref=%s\n' "$selected_sha" >> "$GITHUB_OUTPUT"
              trust_ref
              ;;
            release/*)
              git show-ref --verify --quiet "refs/remotes/origin/$requested_ref" \
                || reject_ref "Trusted release branch '$requested_ref' was not found."
              selected_sha=$(git rev-parse "refs/remotes/origin/$requested_ref^{commit}")
              printf 'selected_ref=%s\n' "$selected_sha" >> "$GITHUB_OUTPUT"
              trust_ref
              ;;
            refs/heads/release/*)
              release_branch="${requested_ref#refs/heads/}"
              git show-ref --verify --quiet "refs/remotes/origin/$release_branch" \
                || reject_ref "Trusted release branch '$requested_ref' was not found."
              selected_sha=$(git rev-parse "refs/remotes/origin/$release_branch^{commit}")
              printf 'selected_ref=%s\n' "$selected_sha" >> "$GITHUB_OUTPUT"
              trust_ref
              ;;
            v*)
              git show-ref --verify --quiet "refs/tags/$requested_ref" \
                || reject_ref "Trusted v* tag '$requested_ref' was not found."
              selected_sha=$(git rev-parse "refs/tags/$requested_ref^{commit}")
              printf 'selected_ref=%s\n' "$selected_sha" >> "$GITHUB_OUTPUT"
              trust_ref
              ;;
            refs/tags/v*)
              tag_name="${requested_ref#refs/tags/}"
              git show-ref --verify --quiet "refs/tags/$tag_name" \
                || reject_ref "Trusted v* tag '$requested_ref' was not found."
              selected_sha=$(git rev-parse "refs/tags/$tag_name^{commit}")
              printf 'selected_ref=%s\n' "$selected_sha" >> "$GITHUB_OUTPUT"
              trust_ref
              ;;
          esac
          if [[ ! "$requested_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            reject_ref "Manual kitaru_ref must be develop, release/*, a v* tag, or a trusted reachable 40-character SHA."
          fi
          git cat-file -e "$requested_ref^{commit}" 2>/dev/null \
            || reject_ref "Requested SHA '$requested_ref' was not fetched from trusted refs."
          if git merge-base --is-ancestor "$requested_ref" refs/remotes/origin/develop; then
            printf 'selected_ref=%s\n' "$requested_ref" >> "$GITHUB_OUTPUT"
            trust_ref
          fi
          while IFS= read -r trusted_ref; do
            if git merge-base --is-ancestor "$requested_ref" "$trusted_ref"; then
              printf 'selected_ref=%s\n' "$requested_ref" >> "$GITHUB_OUTPUT"
              trust_ref
            fi
          done < <(
            git for-each-ref --format='%(refname)' refs/remotes/origin/release
            git for-each-ref --format='%(refname)' refs/tags | grep -E '^refs/tags/v' || true
          )
          reject_ref "Requested SHA '$requested_ref' is not reachable from develop, release/*, or v* tags."
      - name: Checkout Kitaru ref under test
        id: checkout_tested_ref
        if: ${{ steps.trust.outputs.trusted == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.trust.outputs.selected_ref }}
          path: kitaru
          persist-credentials: false
      - name: Install uv
        id: setup_uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.12'
      - name: Resolve live test plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_OPENAI: ${{ inputs.include_openai }}
          INPUT_ANTHROPIC: ${{ inputs.include_anthropic }}
          INPUT_GOOGLE_ADK: ${{ inputs.include_google_adk }}
        run: |
          set -euo pipefail
          suite="${INPUT_SUITE:-provider-core}"
          include_openai="${INPUT_OPENAI:-true}"
          include_anthropic="${INPUT_ANTHROPIC:-true}"
          include_google_adk="${INPUT_GOOGLE_ADK:-false}"
          if [ "$EVENT_NAME" = "schedule" ]; then
            suite="provider-core"
            include_openai="true"
            include_anthropic="true"
            include_google_adk="false"
          fi
          providers=()
          provider_markers=()
          if [ "$include_openai" = "true" ]; then
            providers+=("openai")
            provider_markers+=("live_openai")
          fi
          if [ "$include_anthropic" = "true" ]; then
            providers+=("anthropic")
            provider_markers+=("live_anthropic")
          fi
          if [ "$include_google_adk" = "true" ]; then
            providers+=("google-adk")
          fi
          if [ "${#providers[@]}" -eq 0 ]; then
            echo "::error::Select at least one provider check."
            exit 1
          fi
          suite_marker_suffix="provider_extended"
          if [ "$suite" = "provider-core" ]; then
            suite_marker_suffix="not provider_extended"
          fi
          marker_expr=""
          if [ "${#provider_markers[@]}" -gt 0 ]; then
            provider_expr="${provider_markers[0]}"
            for marker in "${provider_markers[@]:1}"; do
              provider_expr="$provider_expr or $marker"
            done
            marker_expr="($provider_expr) and $suite_marker_suffix"
          fi
          google_adk_marker_expr="live_gemini and $suite_marker_suffix"
          providers_csv=$(IFS=,; echo "${providers[*]}")
          {
            printf 'suite=%s\n' "$suite"
            printf 'include_openai=%s\n' "$include_openai"
            printf 'include_anthropic=%s\n' "$include_anthropic"
            printf 'include_google_adk=%s\n' "$include_google_adk"
            printf 'providers=%s\n' "$providers_csv"
            printf 'marker_expr=%s\n' "$marker_expr"
            printf 'google_adk_marker_expr=%s\n' "$google_adk_marker_expr"
          } >> "$GITHUB_OUTPUT"
      - name: Record tested identity
        id: identity
        working-directory: kitaru
        shell: bash
        env:
          TESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.kitaru_ref || 'develop' }}
        run: |
          set -euo pipefail
          tested_sha=$(git rev-parse HEAD)
          mkdir -p ../llm-integration-results/logs
          {
            printf 'tested_ref=%s\n' "$TESTED_REF"
            printf 'tested_sha=%s\n' "$tested_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Preflight selected live secrets
        id: secret_preflight
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          INCLUDE_OPENAI: ${{ steps.plan.outputs.include_openai }}
          INCLUDE_ANTHROPIC: ${{ steps.plan.outputs.include_anthropic }}
          INCLUDE_GOOGLE_ADK: ${{ steps.plan.outputs.include_google_adk }}
        run: |
          set -euo pipefail
          results_dir="llm-integration-results"
          mkdir -p "$results_dir"
          missing=()
          if [ "$INCLUDE_OPENAI" = "true" ] && [ -z "${OPENAI_API_KEY:-}" ]; then
            missing+=("OPENAI_API_KEY")
          fi
          if [ "$INCLUDE_ANTHROPIC" = "true" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            missing+=("ANTHROPIC_API_KEY")
          fi
          if [ "$INCLUDE_GOOGLE_ADK" = "true" ] \
            && [ -z "${GEMINI_API_KEY:-}" ] \
            && [ -z "${GOOGLE_API_KEY:-}" ]; then
            missing+=("GEMINI_API_KEY or GOOGLE_API_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            unique_missing=$(printf '%s\n' "${missing[@]}" | sort -u | paste -sd ', ' -)
            echo "status=failed" > "$results_dir/secret-preflight.status"
            echo "Missing required live-provider secret(s): $unique_missing" > "$results_dir/secret-preflight.failure"
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=passed" > "$results_dir/secret-preflight.status"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
      - name: Install live-provider dependencies
        id: install_dependencies
        if: ${{ steps.secret_preflight.outputs.ready == 'true' }}
        working-directory: kitaru
        shell: bash
        env:
          SUITE: ${{ steps.plan.outputs.suite }}
          INCLUDE_OPENAI: ${{ steps.plan.outputs.include_openai }}
        run: |
          set -euo pipefail
          extras=(--extra local --extra llm --extra openai-agents --extra claude-agent-sdk)
          if [ "$SUITE" = "provider-extended" ] && [ "$INCLUDE_OPENAI" = "true" ]; then
            extras+=(--extra pydantic-ai --extra langgraph-openai)
          fi
          uv sync --frozen "${extras[@]}"
      - name: Initialize Kitaru project marker
        id: init_project
        if: ${{ steps.secret_preflight.outputs.ready == 'true' }}
        working-directory: kitaru
        run: uv run kitaru init
      - name: Run selected live pytest checks
        id: pytest
        if: ${{ steps.secret_preflight.outputs.ready == 'true' && steps.plan.outputs.marker_expr != '' }}
        working-directory: kitaru
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MARKER_EXPR: ${{ steps.plan.outputs.marker_expr }}
          SUITE: ${{ steps.plan.outputs.suite }}
        run: |
          set +euo pipefail
          log_path="../llm-integration-results/logs/pytest.log"
          junit_path="../llm-integration-results/pytest.junit.xml"
          counts_path="../llm-integration-results/pytest.counts.env"
          uv run pytest tests/live -m "$MARKER_EXPR" --tb=short --durations=10 \
            --junitxml="$junit_path" 2>&1 | tee "$log_path"
          status=${PIPESTATUS[0]}
          set -euo pipefail
          parse_failed=false
          python - "$junit_path" "$counts_path" <<'PY' || parse_failed=true
          import sys
          import xml.etree.ElementTree as ET
          junit_path, counts_path = sys.argv[1:]
          root = ET.parse(junit_path).getroot()
          cases = root.findall(".//testcase")
          skipped = sum(1 for case in cases if case.find("skipped") is not None)
          failed = sum(1 for case in cases if case.find("failure") is not None)
          errors = sum(1 for case in cases if case.find("error") is not None)
          total = len(cases)
          passed = total - skipped - failed - errors
          with open(counts_path, "w", encoding="utf-8") as handle:
              handle.write(f"total={total}\n")
              handle.write(f"passed={passed}\n")
              handle.write(f"skipped={skipped}\n")
              handle.write(f"failed={failed}\n")
              handle.write(f"errors={errors}\n")
          PY
          if [ "$parse_failed" = "true" ]; then
            echo "status=failed" > ../llm-integration-results/pytest.status
            echo "Live pytest checks did not produce parseable JUnit XML." > ../llm-integration-results/pytest.failure
            exit 0
          fi
          total=$(grep '^total=' "$counts_path" | cut -d= -f2)
          passed=$(grep '^passed=' "$counts_path" | cut -d= -f2)
          skipped=$(grep '^skipped=' "$counts_path" | cut -d= -f2)
          failed=$(grep '^failed=' "$counts_path" | cut -d= -f2)
          errors=$(grep '^errors=' "$counts_path" | cut -d= -f2)
          if [ "$status" -eq 5 ]; then
            echo "No pytest tests were selected for marker expression: $MARKER_EXPR" | tee -a "$log_path"
            echo "status=no-tests" > ../llm-integration-results/pytest.status
            echo "No live pytest tests selected for $SUITE." > ../llm-integration-results/pytest.failure
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "status=failed" > ../llm-integration-results/pytest.status
            echo "Live pytest checks failed for marker expression: $MARKER_EXPR" > ../llm-integration-results/pytest.failure
            exit 0
          fi
          if [ "$total" -eq 0 ] || [ "$passed" -eq 0 ]; then
            echo "status=failed" > ../llm-integration-results/pytest.status
            echo "Selected live pytest checks produced no passing tests: total=$total passed=$passed skipped=$skipped failed=$failed errors=$errors." > ../llm-integration-results/pytest.failure
            exit 0
          fi
          echo "status=passed" > ../llm-integration-results/pytest.status
      - name: Run isolated Google ADK live check
        id: google_adk
        if: ${{ steps.secret_preflight.outputs.ready == 'true' && steps.plan.outputs.include_google_adk == 'true' }}
        working-directory: kitaru
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUITE: ${{ steps.plan.outputs.suite }}
          ADK_MARKER_EXPR: ${{ steps.plan.outputs.google_adk_marker_expr }}
        run: |
          set +euo pipefail
          log_path="../llm-integration-results/logs/google-adk.log"
          junit_path="../llm-integration-results/google-adk.junit.xml"
          counts_path="../llm-integration-results/google-adk.counts.env"
          adk_test_file="tests/live/test_google_adk_provider_behavior.py"
          if [ "$SUITE" = "provider-core" ]; then
            adk_test_file="tests/live/test_google_adk_provider_core.py"
          fi
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/kitaru-google-adk-live-env" \
            uv run --frozen --python 3.12 --no-dev --extra google-adk --with pytest \
            pytest -o addopts='-vv' \
            "$adk_test_file" \
            -m "$ADK_MARKER_EXPR" --tb=short --durations=10 \
            --junitxml="$junit_path" 2>&1 | tee "$log_path"
          status=${PIPESTATUS[0]}
          set -euo pipefail
          parse_failed=false
          python - "$junit_path" "$counts_path" <<'PY' || parse_failed=true
          import sys
          import xml.etree.ElementTree as ET
          junit_path, counts_path = sys.argv[1:]
          root = ET.parse(junit_path).getroot()
          cases = root.findall(".//testcase")
          skipped = sum(1 for case in cases if case.find("skipped") is not None)
          failed = sum(1 for case in cases if case.find("failure") is not None)
          errors = sum(1 for case in cases if case.find("error") is not None)
          total = len(cases)
          passed = total - skipped - failed - errors
          with open(counts_path, "w", encoding="utf-8") as handle:
              handle.write(f"total={total}\n")
              handle.write(f"passed={passed}\n")
              handle.write(f"skipped={skipped}\n")
              handle.write(f"failed={failed}\n")
              handle.write(f"errors={errors}\n")
          PY
          if [ "$parse_failed" = "true" ]; then
            echo "status=failed" > ../llm-integration-results/google-adk.status
            echo "Google ADK live check did not produce parseable JUnit XML." > ../llm-integration-results/google-adk.failure
            exit 0
          fi
          total=$(grep '^total=' "$counts_path" | cut -d= -f2)
          passed=$(grep '^passed=' "$counts_path" | cut -d= -f2)
          skipped=$(grep '^skipped=' "$counts_path" | cut -d= -f2)
          failed=$(grep '^failed=' "$counts_path" | cut -d= -f2)
          errors=$(grep '^errors=' "$counts_path" | cut -d= -f2)
          if [ "$status" -ne 0 ]; then
            echo "status=failed" > ../llm-integration-results/google-adk.status
            echo "Google ADK live check failed." > ../llm-integration-results/google-adk.failure
            exit 0
          fi
          if [ "$total" -eq 0 ] || [ "$passed" -eq 0 ]; then
            echo "status=failed" > ../llm-integration-results/google-adk.status
            echo "Google ADK live check produced no passing tests: total=$total passed=$passed skipped=$skipped failed=$failed errors=$errors." > ../llm-integration-results/google-adk.failure
            exit 0
          fi
          echo "status=passed" > ../llm-integration-results/google-adk.status
      - name: Record artifact provenance
        id: provenance
        if: always()
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
          REQUESTED_REF: ${{ steps.trust.outputs.requested_ref }}
          TESTED_REF: ${{ steps.identity.outputs.tested_ref }}
          TESTED_SHA: ${{ steps.identity.outputs.tested_sha }}
          SUITE: ${{ steps.plan.outputs.suite }}
          PROVIDERS: ${{ steps.plan.outputs.providers }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          results_dir = Path("llm-integration-results")
          results_dir.mkdir(parents=True, exist_ok=True)
          recorded_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          def optional(name: str) -> str | None:
              return os.environ.get(name) or None
          providers = optional("PROVIDERS")
          provenance = {
              "schema_version": 1,
              "repository": os.environ["REPOSITORY"],
              "workflow_name": os.environ["WORKFLOW_NAME"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "event_name": os.environ["EVENT_NAME"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "run_url": os.environ["RUN_URL"],
              "identity_recorded_at_utc": recorded_at,
              "requested_ref": optional("REQUESTED_REF"),
              "tested_ref": optional("TESTED_REF"),
              "tested_sha": optional("TESTED_SHA"),
              "suite": optional("SUITE"),
              "providers": providers.split(",") if providers else None,
          }
          (results_dir / "llm-integration.provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          metadata = {
              "tested_ref": os.environ.get("TESTED_REF", ""),
              "tested_sha": os.environ.get("TESTED_SHA", ""),
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "event_name": os.environ["EVENT_NAME"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "run_url": os.environ["RUN_URL"],
              "identity_recorded_at_utc": recorded_at,
          }
          (results_dir / "metadata.env").write_text(
              "".join(f"{key}={value}\n" for key, value in metadata.items()),
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"identity_recorded_at_utc={recorded_at}\n")
          PY
      - name: Summarize live-provider results
        id: summarize
        if: always()
        shell: bash
        env:
          TESTED_REF: ${{ steps.identity.outputs.tested_ref }}
          TESTED_SHA: ${{ steps.identity.outputs.tested_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IDENTITY_RECORDED_AT_UTC: ${{ steps.provenance.outputs.identity_recorded_at_utc }}
          SUITE: ${{ steps.plan.outputs.suite }}
          PROVIDERS: ${{ steps.plan.outputs.providers }}
          MARKER_EXPR: ${{ steps.plan.outputs.marker_expr }}
          INCLUDE_GOOGLE_ADK: ${{ steps.plan.outputs.include_google_adk }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_CHECKOUT_OUTCOME: ${{ steps.checkout_workflow.outcome }}
          TRUST_OUTCOME: ${{ steps.trust.outcome }}
          TESTED_CHECKOUT_OUTCOME: ${{ steps.checkout_tested_ref.outcome }}
          SETUP_UV_OUTCOME: ${{ steps.setup_uv.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          INSTALL_OUTCOME: ${{ steps.install_dependencies.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          INIT_OUTCOME: ${{ steps.init_project.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          SECRET_PREFLIGHT_OUTCOME: ${{ steps.secret_preflight.outcome }}
        run: |
          set -euo pipefail
          results_dir="llm-integration-results"
          mkdir -p "$results_dir/logs"
          failures_file="$results_dir/llm-integration.failures.txt"
          summary_file="$results_dir/llm-integration.summary.md"
          discord_file="$results_dir/llm-integration.discord.md"
          : > "$failures_file"
          if [ "${WORKFLOW_CHECKOUT_OUTCOME:-success}" = "failure" ]; then
            echo "Trusted workflow ref checkout failed." >> "$failures_file"
          fi
          if [ "${TRUST_OUTCOME:-success}" = "failure" ]; then
            echo "Requested Kitaru ref trust check failed." >> "$failures_file"
          fi
          if [ "${TESTED_CHECKOUT_OUTCOME:-success}" = "failure" ]; then
            echo "Kitaru ref under test checkout failed." >> "$failures_file"
          fi
          if [ "${SETUP_UV_OUTCOME:-success}" = "failure" ]; then
            echo "uv setup failed." >> "$failures_file"
          fi
          if [ "${PLAN_OUTCOME:-success}" = "failure" ]; then
            echo "Live test plan resolution failed." >> "$failures_file"
          fi
          if [ "${INSTALL_OUTCOME:-success}" = "failure" ]; then
            echo "Live-provider dependency installation failed." >> "$failures_file"
          fi
          if [ "${INIT_OUTCOME:-success}" = "failure" ]; then
            echo "Kitaru project initialization failed." >> "$failures_file"
          fi
          if [ "${IDENTITY_OUTCOME:-success}" = "failure" ]; then
            echo "Tested ref/SHA identity recording failed." >> "$failures_file"
          fi
          if [ "${SECRET_PREFLIGHT_OUTCOME:-success}" = "failure" ]; then
            echo "Live secret preflight failed before writing its result file." >> "$failures_file"
          fi
          if [ "${PROVENANCE_OUTCOME:-success}" = "failure" ]; then
            echo "Artifact provenance recording failed." >> "$failures_file"
          fi
          if [ -f "$results_dir/secret-preflight.failure" ]; then
            cat "$results_dir/secret-preflight.failure" >> "$failures_file"
          fi
          if [ -f "$results_dir/pytest.failure" ]; then
            cat "$results_dir/pytest.failure" >> "$failures_file"
          fi
          if [ -f "$results_dir/google-adk.failure" ]; then
            cat "$results_dir/google-adk.failure" >> "$failures_file"
          fi
          fail_count=$(grep -cve '^$' "$failures_file" || true)
          failed_checks="none"
          if [ "$fail_count" -gt 0 ]; then
            failed_checks=$(paste -sd '; ' "$failures_file")
          fi
          secret_status="not-run"
          pytest_status="not-run"
          pytest_counts="not-available"
          google_adk_status="not-run"
          google_adk_counts="not-available"
          if [ -f "$results_dir/secret-preflight.status" ]; then
            secret_status=$(cut -d= -f2 "$results_dir/secret-preflight.status")
          fi
          if [ -f "$results_dir/pytest.status" ]; then
            pytest_status=$(cut -d= -f2 "$results_dir/pytest.status")
          fi
          if [ -f "$results_dir/pytest.counts.env" ]; then
            pytest_counts=$(tr '\n' ' ' < "$results_dir/pytest.counts.env" | sed 's/[[:space:]]*$//')
          fi
          if [ -f "$results_dir/google-adk.status" ]; then
            google_adk_status=$(cut -d= -f2 "$results_dir/google-adk.status")
          fi
          if [ -f "$results_dir/google-adk.counts.env" ]; then
            google_adk_counts=$(tr '\n' ' ' < "$results_dir/google-adk.counts.env" | sed 's/[[:space:]]*$//')
          fi
          {
            echo "# LLM integration results"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested ref | \`$TESTED_REF\` |"
            echo "| Tested SHA | \`$TESTED_SHA\` |"
            echo "| Workflow SHA | \`$WORKFLOW_SHA\` |"
            echo "| Event | \`$EVENT_NAME\` |"
            echo "| Run ID | \`$RUN_ID\` |"
            echo "| Run attempt | \`$RUN_ATTEMPT\` |"
            echo "| Run URL | $RUN_URL |"
            echo "| Identity recorded at (UTC) | \`$IDENTITY_RECORDED_AT_UTC\` |"
            echo "| Suite | \`$SUITE\` |"
            echo "| Providers | \`${PROVIDERS:-none}\` |"
            echo "| Pytest marker | \`$MARKER_EXPR\` |"
            echo "| Secret preflight status | \`$secret_status\` |"
            echo "| Live pytest status | \`$pytest_status\` |"
            echo "| Live pytest counts | \`$pytest_counts\` |"
            echo "| Google ADK status | \`$google_adk_status\` |"
            echo "| Google ADK counts | \`$google_adk_counts\` |"
            echo "| Failures | \`$fail_count\` |"
            echo
            echo "No PyPI package, Docker image, Helm chart, Git tag, GitHub Release, or release branch was published."
            echo
            if [ "$fail_count" -gt 0 ]; then
              echo "## Failures"
              sed 's/^/- /' "$failures_file"
              echo
            fi
            echo "## Logs"
            echo
            echo "Raw logs are uploaded in the \`llm-integration-results\` artifact."
          } > "$summary_file"
          {
            echo "Someone needs to debug Kitaru live provider checks."
            echo
            echo "- Workflow: $WORKFLOW_NAME"
            echo "- Tested ref/SHA: $TESTED_REF / $TESTED_SHA"
            echo "- Suite/providers: $SUITE / ${PROVIDERS:-none}"
            echo "- Failed checks: $failed_checks"
            echo "- Run: $RUN_URL"
          } > "$discord_file"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          {
            printf 'fail_count=%s\n' "$fail_count"
            printf 'failed_checks=%s\n' "$failed_checks"
          } >> "$GITHUB_OUTPUT"
      - name: Upload live-provider results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: llm-integration-results
          path: llm-integration-results
          if-no-files-found: warn
      - name: Fail if live-provider checks failed
        if: ${{ always() && steps.summarize.outputs.fail_count != '0' }}
        env:
          FAILED_CHECKS: ${{ steps.summarize.outputs.failed_checks }}
        run: |
          echo "One or more live-provider checks failed: $FAILED_CHECKS"
          exit 1
  notify-discord:
    name: Notify Discord on failure
    needs: live-provider-checks
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: live-provider-tests
    steps:
      - name: Download live-provider results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: llm-integration-results
          path: ./llm-integration-results
      - name: Send Discord notification
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_SRE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          TESTED_REF: ${{ needs.live-provider-checks.outputs.tested_ref }}
          TESTED_SHA: ${{ needs.live-provider-checks.outputs.tested_sha }}
          SUITE: ${{ needs.live-provider-checks.outputs.suite }}
          PROVIDERS: ${{ needs.live-provider-checks.outputs.providers }}
          FAILED_CHECKS: ${{ needs.live-provider-checks.outputs.failed_checks }}
        run: |-
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK_SRE is not configured; skipping Discord notification."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          artifact_message = Path("llm-integration-results/llm-integration.discord.md")
          if artifact_message.exists():
              message = artifact_message.read_text(encoding="utf-8")
          else:
              failed = os.environ.get("FAILED_CHECKS") or "setup failed before summary artifact was written"
              message = "\n".join(
                  [
                      "Someone needs to debug Kitaru live provider checks.",
                      "",
                      f"- Workflow: {os.environ['WORKFLOW_NAME']}",
                      f"- Tested ref/SHA: {os.environ.get('TESTED_REF') or 'unknown'} / {os.environ.get('TESTED_SHA') or 'unknown'}",
                      f"- Suite/providers: {os.environ.get('SUITE') or 'unknown'} / {os.environ.get('PROVIDERS') or 'unknown'}",
                      f"- Failed checks: {failed}",
                      f"- Run: {os.environ['RUN_URL']}",
                  ]
              )
          payload = {"content": message[:1900]}
          Path("discord-payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          curl -fsS -H 'Content-Type: application/json' -d @discord-payload.json "$DISCORD_WEBHOOK"
