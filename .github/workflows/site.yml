---
name: Site
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - site/**
      - docs/**
      - scripts/generate_*.py
      - scripts/merge_site.sh
      - CHANGELOG.md
      - wrangler.toml
  pull_request_target:
    types: [closed]
permissions: {}
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.event.pull_request.number
    || github.ref }}
  cancel-in-progress: true
jobs:
  build-deploy:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # --- Generate docs content (Python-only generators) ---
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run python scripts/generate_cli_docs.py
      - run: uv run python scripts/generate_changelog_docs.py

      # --- Build docs (Node) ---
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d  # v6.0.5
        with:
          version: 10.33.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: docs/.node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        working-directory: docs

      # --- Generate SDK reference (needs both Python griffe + Node fumadocs-python) ---
      - run: uv pip install ./docs/node_modules/fumadocs-python
      - run: uv run python scripts/generate_sdk_docs.py
      - run: node scripts/convert-sdk-docs.mjs
        working-directory: docs
      - run: pnpm run build
        working-directory: docs

      # --- Build site (Astro) ---
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm run build
        working-directory: site

      # --- Merge docs into site ---
      - run: bash scripts/merge_site.sh

      # --- Check internal links in built output ---
      - name: Check internal links
        # Keep this SHA in sync with .github/workflows/ci.yml — see the
        # comment there for why we pin a post-v2.8.0 master commit.
        uses: lycheeverse/lychee-action@b40e218fdac9481d3c13098d4e1ee56f3b589356  # master @ 2026-05-03
        with:
          args: --offline --root-dir site/dist --no-progress --verbose --index-files
            index.html 'site/dist/**/*.html'
          fail: true
          jobSummary: true

      # --- Deploy unified Worker (production) ---
      - name: Deploy production
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name
          == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      # --- Deploy preview Worker (same-repo PRs only; skip when secrets
      #     are unavailable, e.g. Dependabot PRs) ---
      - name: Deploy preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
          == github.repository && env.HAS_CF_SECRETS == 'true'
        id: preview
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --name kitaru-site-preview-${{ github.event.pull_request.number }}

      # --- Sticky PR comment with preview URL ---
      - name: Comment preview URL
        if: steps.preview.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0  # v3.0.4
        with:
          header: site-preview
          message: |
            ## Site Preview
            | | |
            |---|---|
            | **Preview URL** | https://kitaru-site-preview-${{ github.event.pull_request.number }}.zenml-migration.workers.dev |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.sha }}` |

  # --- Clean up preview Worker when same-repo PR closes ---
  cleanup-preview:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-latest
    permissions: {}
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Delete preview Worker
        if: env.HAS_CF_SECRETS == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: delete --name kitaru-site-preview-${{ github.event.pull_request.number }}
            --force
