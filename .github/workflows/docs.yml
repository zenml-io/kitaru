---
name: SDK Reference Docs
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - scripts/generate_*.py
      - src/kitaru/**
      - CHANGELOG.md
      - pyproject.toml
      - uv.lock
      - wrangler.toml
      - wrangler.redirect.toml
permissions: {}
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  KITARU_ANALYTICS_OPT_IN: false
  ZENML_ANALYTICS_OPT_IN: false
jobs:
  build-deploy:
    # PRs only build (no secrets/deploy). Production deploy runs from main or a
    # manual dispatch — the Cloudflare token is never exposed to PR-triggered
    # runs, which execute PR-controlled generation/build scripts.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WRANGLER_VERSION: 4.95.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: false
      - run: uv sync --frozen
      - name: Generate CLI reference
        run: uv run python scripts/generate_cli_docs.py
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: docs/.node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - name: Install SDK docs generator bridge
        run: uv pip install ./docs/node_modules/fumadocs-python
      - name: Generate SDK reference data
        run: uv run python scripts/generate_sdk_docs.py
      - name: Convert SDK reference to MDX
        run: node scripts/convert-sdk-docs.mjs
        working-directory: docs
      - name: Build docs static export
        run: pnpm run build
        working-directory: docs
      - name: Test redirect worker mapping
        run: node --test docs/worker/redirect.test.mjs
      - name: Deploy production docs
        # Push deploys only from main; a manual workflow_dispatch deploys whichever
        # branch it runs against, so docs can be shipped to production from develop.
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name
          == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy
      - name: Deploy redirect worker
        # The kitaru-site worker redirects kitaru.ai/docs/* to their new homes
        # (docs.zenml.io/kitaru, sdkdocs.kitaru.ai). It has no build output, so
        # redeploy it alongside the SDK site to keep the cutover in sync.
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name
          == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy --config wrangler.redirect.toml
