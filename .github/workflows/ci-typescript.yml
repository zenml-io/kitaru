---
name: TypeScript CI
on:
  workflow_dispatch:
    inputs:
      typescript-tests:
        description: TypeScript test and coverage execution (benchmark only)
        type: choice
        options: [repeated, coverage-once]
        default: repeated
      mastra-compat:
        description: Mastra compatibility matrix scope
        type: choice
        options: [all, boundary]
        default: all
  push:
    branches: [develop]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    paths:
      - .github/workflows/ci-typescript.yml
      - .github/workflows/ci.yml
      - .node-version
      - biome.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - packages/**
      - examples/typescript/**
      - tests/typescript/**
      - openapi/**
      - docs/book/adapters/mastra.md
      - devtools/tsconfig.json
      - devtools/**/*.mjs
      - scripts/benchmark-typescript-ci.mjs
      - scripts/clean-typescript-dist.mjs
      - scripts/smoke-typescript-packages.mjs
      - scripts/typescript-packages.mjs
      - scripts/fixtures/mastra-memory-*
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
env:
  KITARU_SERVER_ANALYTICS_OPT_IN: false
  ZENML_ANALYTICS_OPT_IN: false
  ZENML_LOGGING_VERBOSITY: INFO
  AUTO_OPEN_DASHBOARD: false
  ZENML_ENABLE_RICH_TRACEBACK: false
jobs:
  typescript:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Test TypeScript packages with coverage
        env:
          TYPESCRIPT_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.typescript-tests || 'coverage-once' }}
          MASTRA_COMPAT_SCOPE: ${{ github.event_name == 'pull_request' && 'boundary' || (github.event_name == 'workflow_dispatch' && inputs.mastra-compat || 'all') }}
          POSTGRES_PASSWORD: password
        run: >-
          KITARU_TEST_MASTRA_POSTGRES_URL="postgres://postgres:${POSTGRES_PASSWORD}@localhost:5433/postgres"
          node scripts/benchmark-typescript-ci.mjs "$TYPESCRIPT_TEST_MODE"
          "$RUNNER_TEMP/benchmark-typescript"
          --mastra-compat="$MASTRA_COMPAT_SCOPE"
      - name: Upload TypeScript benchmark evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: benchmark-typescript
          path: ${{ runner.temp }}/benchmark-typescript
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - run: pnpm run pack:check:built
      - run: uv sync --frozen --extra server --extra cli --extra worker
      - name: Test compiled TypeScript adapters through Worker
        run: uv run pytest -q tests/typescript
      - run: pnpm --filter @zenml-io/kitaru build
      - run: pnpm --filter @zenml-io/kitaru-vercel-ai build
      - name: Validate ticket resolver example
        working-directory: examples/typescript/vercel_ai_ticket_resolver
        run: |
          pnpm build
          pnpm test
          pnpm test:evaluator
          pnpm typecheck
          pnpm lint
          pnpm test:e2e
  typescript-node-24:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["24.x"]') || fromJSON('["24.0.0", "24.x"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: pnpm run test:core:built
      - run: pnpm run pack:check:built
  typescript-node-26:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["26.x"]') || fromJSON('["26.0.0", "26.x"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: pnpm run test:core:built
      - run: pnpm run pack:check:built
