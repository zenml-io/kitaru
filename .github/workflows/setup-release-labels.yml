---
name: Set up release labels
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |-
          set -euo pipefail
          gh label create requires:core --color 1D76DB --description "Include in a future Kitaru core release" --force
          gh label create requires:frontend --color 5319E7 --description "Requires matching frontend work" --force
          gh label create requires:plugins --color FBCA04 --description "Requires work across all plugins" --force
          gh label create requires:skills --color D4C5F9 --description "Requires Kitaru skills updates" --force
          gh label create requires:zenml-docs --color 0075CA --description "Requires ZenML documentation updates" --force
          gh label create requires:website --color 0E8A16 --description "Requires website updates" --force
          gh label create requires:none --color 6A737D --description "No release or follow-up work" --force
          gh label create api-change --color B60205 --description "Changes an adapter-facing core API" --force
          uv run --no-project --with packaging==26.2 \
            python scripts/release_units.py list --format json \
            | jq -r '.units[] | select(.slug != "kitaru") | .release_label' \
            | while read -r label; do
                gh label create "$label" --color C5DEF5 --description "Requires work for this plugin release unit" --force
              done
