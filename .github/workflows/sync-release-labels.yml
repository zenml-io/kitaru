---
name: Sync release labels
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Create or update release labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |-
          set -euo pipefail
          units=(core)
          while read -r project; do
            units+=("$(basename "$(dirname "$project")")")
          done < <(find plugins/packages -mindepth 2 -maxdepth 2 \
            -name pyproject.toml -print | sort)
          for unit in "${units[@]}"; do
            gh label create "release:$unit:major" --force \
              --color B60205 --description "Release $unit with a major bump"
            gh label create "release:$unit:minor" --force \
              --color D93F0B --description "Release $unit with a minor bump"
            gh label create "release:$unit:patch" --force \
              --color FBCA04 --description "Release $unit with a patch bump"
            gh label create "release:$unit:stable" --force \
              --color 0E8A16 --description "Promote the current $unit RC to stable"
            gh label create "release:$unit:none" --force \
              --color C5DEF5 --description "Do not release $unit for this PR"
          done
          gh label create release:channel:stable --force \
            --color 0E8A16 --description "Prepare a stable release"
          gh label create release:channel:rc --force \
            --color 5319E7 --description "Prepare a release candidate"
