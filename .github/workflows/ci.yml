---
name: CI
on:
  push:
    branches: [develop]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  KITARU_ANALYTICS_OPT_IN: false
  KITARU_TEMPLATE_REF: 2eb723766d1e31448e569c0f241c255752c3d721
  ZENML_ANALYTICS_OPT_IN: false
  ZENML_LOGGING_VERBOSITY: INFO
  AUTO_OPEN_DASHBOARD: false
  ZENML_ENABLE_RICH_TRACEBACK: false
jobs:
  lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: uv sync --frozen --extra server --extra otel --extra mcp
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python scripts/report_mcp_schema.py --check
      - run: uv run bash scripts/check_openapi.sh
      - run: uv run --with pyyaml python scripts/audit-example-coverage.py
      - run: find .github -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name dependabot.yml
          -print0 | xargs -0 uv run yamlfix --check
  typescript:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:built
      - run: pnpm run pack:check:built
      - run: uv sync --frozen --extra server --extra cli --extra worker
      - name: Test compiled TypeScript adapters through Worker
        run: uv run pytest -q tests/typescript
  typescript-ticket-resolver:
    name: TypeScript ticket resolver
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zenml-io/kitaru build
      - run: pnpm --filter @zenml-io/kitaru-vercel-ai build
      - run: uv sync --frozen --extra server --extra cli --extra worker
      - name: Install standalone example
        working-directory: v2_examples/vercel_ai_ticket_resolver
        run: CI=true pnpm --ignore-workspace install --frozen-lockfile
      - name: Validate standalone example
        working-directory: v2_examples/vercel_ai_ticket_resolver
        run: |
          pnpm build
          pnpm test
          pnpm test:evaluator
          pnpm typecheck
          pnpm lint
          pnpm test:e2e
  client-import:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: uv venv .venv-clean
      - run: uv pip install --python .venv-clean/bin/python .
      - run: .venv-clean/bin/python -c "import kitaru.client"
  typos:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f  # v1.49.0
  typecheck:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: >-
          uv sync --frozen
          --extra server
          --extra otel
          --extra mcp
          --extra cli
          --extra worker
      - run: uv run ty check
  audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: uv sync --frozen --all-extras
      - name: Run pip-audit (with documented ignore list)
        run: |
          awk '/^(CVE|GHSA|PYSEC)-/ {printf "--ignore-vuln %s ", $1}' \
            .github/pip-audit-ignored.txt | xargs uv run pip-audit
  public-template-contract:
    name: Public template against current Kitaru
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned public template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: zenml-io/kitaru-template
          ref: ${{ env.KITARU_TEMPLATE_REF }}
          path: kitaru-template
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install current Kitaru build environment
        run: uv sync --frozen --extra server --extra cli --extra worker
      - name: Build current Kitaru and plugin wheels
        run: >-
          uv run --no-sync python scripts/smoke_plugin_artifacts.py
          --candidate-dir plugins/candidate-wheels
      - name: Sync pinned public template
        working-directory: kitaru-template
        run: uv sync --frozen
      - name: Install current Kitaru artifacts into template
        run: |
          uv pip install \
            --python kitaru-template/.venv/bin/python \
            --reinstall \
            --no-deps \
            plugins/candidate-wheels/kitaru-*.whl \
            plugins/candidate-wheels/kitaru_pydantic_ai-*.whl \
            plugins/candidate-wheels/kitaru_langfuse_importer-*.whl
          uv pip check --python kitaru-template/.venv/bin/python
      - name: Test public template contracts
        working-directory: kitaru-template
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_contract.py
          tests/test_repository_contract.py
      - name: Run public template end to end
        working-directory: kitaru-template
        run: uv run --no-sync python scripts/run_ci_e2e.py
        env:
          UV_FIND_LINKS: ${{ github.workspace }}/plugins/candidate-wheels
          UV_NO_INDEX: '1'
          UV_NO_SYNC: '1'
  links:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Pinned to a post-v2.8.0 master commit because the v2.8.0 release
      # ships an installer that can't extract lychee >= 0.24.0 tarballs
      # (subfolder layout) and defaults to lychee v0.23.0, which doesn't
      # understand the new `include_fragments` enum in lychee.toml. The
      # pinned SHA freezes behavior; revisit when a tagged release lands.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # master @ 2026-05-03
        with:
          # Source MDX uses docs-app-root routes such as /guides/...; site.yml
          # validates those after docs build/materialization. This job checks raw Markdown.
          args: --root-dir . --verbose --no-progress './**/*.md'
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release-units:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    outputs:
      plugin-matrix: ${{ steps.inventory.outputs.plugin-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.12'
      - name: Validate release units and build plugin matrix
        id: inventory
        run: |
          plugin_matrix=$(uv run --no-project --with packaging==26.2 python scripts/release_units.py matrix)
          printf 'plugin-matrix=%s\n' "$plugin_matrix" >> "$GITHUB_OUTPUT"
  docker-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build server image
        run: >-
          docker build -f docker/dev-server.Dockerfile --target runtime
          -t kitaru-ci-server .
      - name: Start PostgreSQL
        run: |
          docker network create kitaru-ci
          docker run -d --rm --name kitaru-ci-postgres --network kitaru-ci \
            -e POSTGRES_PASSWORD=password postgres:16-alpine
          for _ in $(seq 1 30); do
            if docker exec kitaru-ci-postgres pg_isready -U postgres; then
              exit 0
            fi
            sleep 2
          done
          docker logs kitaru-ci-postgres
          exit 1
      - name: Start server container
        run: >-
          docker run -d --rm --name kitaru-ci-server --network kitaru-ci
          -p 18080:8000
          -e KITARU_SERVER_AUTH_SCHEME=none
          -e KITARU_SERVER_DB_HOST=kitaru-ci-postgres
          -e KITARU_SERVER_DB_PWD=password
          -e KITARU_SERVER_SECRET_ENCRYPTION_KEY=ci-only-encryption-key-ci-only-encryption-key
          -e KITARU_SERVER_JWT_SIGNING_KEY=ci-only-signing-key-ci-only-signing-key
          -e KITARU_SERVER_ANALYTICS_OPT_IN=false
          kitaru-ci-server
      - name: Wait for health endpoint
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health >/tmp/kitaru-health.txt; then
              cat /tmp/kitaru-health.txt
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy in time." >&2
          docker logs kitaru-ci-server || true
          exit 1
      - name: Smoke test server info API
        run: |
          set -euo pipefail
          http_status=$(curl -sS -o /tmp/server-info.json -w '%{http_code}' 'http://127.0.0.1:18080/api/v1/info')
          test "$http_status" = "200"
          python -m json.tool /tmp/server-info.json
      - name: Dump container logs on failure
        if: failure()
        run: docker logs kitaru-ci-server || true
      - name: Stop server container
        if: always()
        run: docker rm -f kitaru-ci-server || true
  plugin-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.12'
      - run: uv sync --project plugins --frozen --all-packages
      - run: >-
          uv run --project plugins ruff format
          --config plugins/pyproject.toml --check plugins
      - run: >-
          uv run --project plugins ruff check
          --config plugins/pyproject.toml plugins
      - run: uv run --project plugins ty check --project plugins
      - run: >-
          uv run --project plugins pytest -q -c plugins/pyproject.toml
          plugins/tests
          tests/server/test_default_plugins.py
      - run: >-
          uv run --project plugins python -c
          "from kitaru.server.api.bootstrap import DEFAULT_PLUGIN_DEFINITIONS;
          assert DEFAULT_PLUGIN_DEFINITIONS"
  plugin-package:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: release-units
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-units.outputs.plugin-matrix).matrix }}
    name: plugin package (${{ matrix.package }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.12'
      - name: Test installed package artifact
        env:
          PACKAGE_PATH: ${{ matrix.path }}
        run: uv run --no-project python scripts/smoke_plugin_artifacts.py --package
          "$PACKAGE_PATH"
  mcp-wheel-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.12'
      - run: uv build --wheel
      - name: Test clean base and MCP wheel installations
        run: >-
          KITARU_TEST_WHEEL=dist uv run
          --extra server --extra otel --extra mcp
          pytest tests/mcp/test_installed_contract.py
  cli-artifact-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.12'
      - name: Test clean CLI wheel and source installations
        run: uv run --no-sync python scripts/smoke_cli_artifacts.py
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: py311-base
            python-version: '3.11'
            sync-command: uv sync --frozen --extra server --extra otel
            pytest-command: uv run pytest --ignore=tests/cli --ignore=tests/mcp --ignore=tests/typescript
          - name: py312-base
            python-version: '3.12'
            sync-command: uv sync --frozen --extra server --extra otel
            pytest-command: uv run pytest --ignore=tests/cli --ignore=tests/mcp --ignore=tests/typescript
          - name: py313-base
            python-version: '3.13'
            sync-command: uv sync --frozen --extra server --extra otel
            pytest-command: uv run pytest --ignore=tests/cli --ignore=tests/mcp --ignore=tests/typescript
          - name: py314-base
            python-version: '3.14'
            sync-command: uv sync --frozen --extra server --extra otel
            pytest-command: uv run pytest --ignore=tests/cli --ignore=tests/mcp --ignore=tests/typescript
          - name: py311-cli
            python-version: '3.11'
            sync-command: uv sync --frozen --extra server --extra otel --extra cli
              --extra worker
            pytest-command: uv run pytest tests/cli tests/scripts
          - name: py312-cli
            python-version: '3.12'
            sync-command: uv sync --frozen --extra server --extra otel --extra cli
              --extra worker
            pytest-command: uv run pytest tests/cli tests/scripts
          - name: py313-cli
            python-version: '3.13'
            sync-command: uv sync --frozen --extra server --extra otel --extra cli
              --extra worker
            pytest-command: uv run pytest tests/cli tests/scripts
          - name: py314-cli
            python-version: '3.14'
            sync-command: uv sync --frozen --extra server --extra otel --extra cli
              --extra worker
            pytest-command: uv run pytest tests/cli tests/scripts
          - name: py311-mcp
            python-version: '3.11'
            sync-command: uv sync --frozen --extra server --extra otel --extra mcp
            pytest-command: uv run pytest tests/mcp
          - name: py312-mcp
            python-version: '3.12'
            sync-command: uv sync --frozen --extra server --extra otel --extra mcp
            pytest-command: uv run pytest tests/mcp
          - name: py313-mcp
            python-version: '3.13'
            sync-command: uv sync --frozen --extra server --extra otel --extra mcp
            pytest-command: uv run pytest tests/mcp
          - name: py314-mcp
            python-version: '3.14'
            sync-command: uv sync --frozen --extra server --extra otel --extra mcp
            pytest-command: uv run pytest tests/mcp
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: ${{ matrix.sync-command }}
      - name: Verify base install does not resolve MCP
        if: contains(matrix.name, 'base')
        run: >-
          uv run python -c "import importlib.util; import kitaru; import kitaru.client;
          assert importlib.util.find_spec('mcp') is None"
      - run: ${{ matrix.pytest-command }}
