---
name: CI
on:
  push:
    branches: [develop]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  KITARU_ANALYTICS_OPT_IN: false
  ZENML_ANALYTICS_OPT_IN: false
  ZENML_LOGGING_VERBOSITY: INFO
  AUTO_OPEN_DASHBOARD: false
  ZENML_ENABLE_RICH_TRACEBACK: false
jobs:
  lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - run: uv sync --frozen --extra server --extra otel --extra mcp
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python scripts/report_mcp_schema.py --check
      - run: uv run bash scripts/check_openapi.sh
      - run: find .github -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name dependabot.yml
          -print0 | xargs -0 uv run yamlfix --check
  client-import:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - run: uv venv .venv-clean
      - run: uv pip install --python .venv-clean/bin/python .
      - run: .venv-clean/bin/python -c "import kitaru.client"
  typos:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14  # v1.48.0
  typecheck:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - run: uv sync --frozen
      - run: uv run ty check
  audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - run: uv sync --frozen
      - name: Run pip-audit (with documented ignore list)
        run: |
          awk '/^(CVE|GHSA|PYSEC)-/ {printf "--ignore-vuln %s ", $1}' \
            .github/pip-audit-ignored.txt | xargs uv run pip-audit
  canonical-example:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - name: Test canonical example contracts
        run: uv run pytest -q tests/test_support_agent_example.py
  links:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      # Pinned to a post-v2.8.0 master commit because the v2.8.0 release
      # ships an installer that can't extract lychee >= 0.24.0 tarballs
      # (subfolder layout) and defaults to lychee v0.23.0, which doesn't
      # understand the new `include_fragments` enum in lychee.toml. The
      # pinned SHA freezes behavior; revisit when a tagged release lands.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # master @ 2026-05-03
        with:
          # Source MDX uses docs-app-root routes such as /guides/...; site.yml
          # validates those after docs build/materialization. This job checks raw Markdown.
          args: --root-dir . --verbose --no-progress './**/*.md'
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker-smoke:
    # UI release assets may require KITARU_UI_RELEASE_TOKEN; never expose it to PR code.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: '3.12'
      - name: Download stable Kitaru UI
        run: bash scripts/download-ui.sh
        env:
          KITARU_UI_RELEASE_TOKEN: ${{ secrets.KITARU_UI_RELEASE_TOKEN }}
      - name: Build server image
        run: >-
          docker build -f docker/dev-server.Dockerfile --target runtime
          -t kitaru-ci-server .
      - name: Start PostgreSQL
        run: |
          docker network create kitaru-ci
          docker run -d --rm --name kitaru-ci-postgres --network kitaru-ci \
            -e POSTGRES_PASSWORD=password postgres:16-alpine
          for _ in $(seq 1 30); do
            if docker exec kitaru-ci-postgres pg_isready -U postgres; then
              exit 0
            fi
            sleep 2
          done
          docker logs kitaru-ci-postgres
          exit 1
      - name: Start server container
        run: >-
          docker run -d --rm --name kitaru-ci-server --network kitaru-ci
          -p 18080:8000
          -e KITARU_SERVER_AUTH_SCHEME=none
          -e KITARU_SERVER_DB_HOST=kitaru-ci-postgres
          -e KITARU_SERVER_DB_PWD=password
          -e KITARU_SERVER_SECRET_ENCRYPTION_KEY=ci-only-encryption-key-ci-only-encryption-key
          -e KITARU_SERVER_ANALYTICS_OPT_IN=false
          kitaru-ci-server
      - name: Wait for health endpoint
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health >/tmp/kitaru-health.txt; then
              cat /tmp/kitaru-health.txt
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy in time." >&2
          docker logs kitaru-ci-server || true
          exit 1
      - name: Verify bundled dashboard assets
        run: bash scripts/verify-server-ui.sh kitaru-ci-server
      - name: Smoke test root route serves dashboard HTML
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/root-response.txt -w '%{http_code}' 'http://127.0.0.1:18080/')
          test "$status" = "200"
          grep -qi '<!doctype html\|<html' /tmp/root-response.txt || {
            echo "Root route did not return HTML." >&2
            cat /tmp/root-response.txt >&2
            exit 1
          }
      - name: Smoke test device verification route
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/device-verify-response.txt -w '%{http_code}' 'http://127.0.0.1:18080/devices/verify?device_id=test&user_code=test')
          test "$status" = "200"
          if grep -q 'An unexpected error occurred' /tmp/device-verify-response.txt; then
            echo "Device verification route returned the generic unexpected-error payload." >&2
            cat /tmp/device-verify-response.txt >&2
            exit 1
          fi
          if docker logs kitaru-ci-server 2>&1 | grep -q 'TemplateNotFound'; then
            echo "TemplateNotFound appeared in container logs after hitting /devices/verify." >&2
            exit 1
          fi
      - name: Dump container logs on failure
        if: failure()
        run: docker logs kitaru-ci-server || true
      - name: Stop server container
        if: always()
        run: docker rm -f kitaru-ci-server || true
  wheel-packaging:
    # UI release assets may require KITARU_UI_RELEASE_TOKEN; never expose it to PR code.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: '3.12'
      - name: Download stable Kitaru UI
        run: bash scripts/download-ui.sh
        env:
          KITARU_UI_RELEASE_TOKEN: ${{ secrets.KITARU_UI_RELEASE_TOKEN }}
      - name: Build wheel
        run: uv build --wheel
      - name: Verify Kitaru UI in wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          uv run --no-project scripts/verify-ui-wheel.py "$WHEEL"
  plugin-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: '3.12'
      - run: uv sync --project plugins --frozen --all-packages
      - run: >-
          uv run --project plugins ruff format
          --config plugins/pyproject.toml --check plugins
      - run: >-
          uv run --project plugins ruff check
          --config plugins/pyproject.toml plugins
      - run: uv run --project plugins ty check --project plugins
      - run: >-
          uv run --project plugins pytest -q -c plugins/pyproject.toml
          plugins/tests
          tests/server/test_default_plugins.py
      - run: >-
          uv run --project plugins python -c
          "from kitaru.server.api.bootstrap import DEFAULT_PLUGIN_DEFINITIONS;
          assert DEFAULT_PLUGIN_DEFINITIONS"
  plugin-package:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - braintrust-importer
          - evaluator
          - jsonl-importer
          - langfuse-importer
          - langgraph
          - langsmith-importer
          - openai-agents
          - opentelemetry-importer
          - pydantic-ai
    name: plugin package (${{ matrix.package }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: '3.12'
      - name: Test installed package artifact
        run: >-
          uv run --no-project python scripts/smoke_plugin_artifacts.py
          --package "plugins/packages/${{ matrix.package }}"
  mcp-wheel-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: '3.12'
      - run: uv build --wheel
      - name: Test clean base and MCP wheel installations
        run: KITARU_TEST_WHEEL=dist uv run --extra mcp pytest tests/mcp/test_installed_contract.py
  cli-artifact-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: '3.12'
      - name: Test clean CLI wheel and source installations
        run: uv run --no-sync python scripts/smoke_cli_artifacts.py
  google-adk-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      KITARU_REQUIRE_GOOGLE_ADK_CONTRACT: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: '3.12'
      - name: Run installed Google ADK no-provider contract tests
        run: >-
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/kitaru-google-adk-contract-env"
          uv run --python 3.12 --no-dev --extra google-adk --with pytest
          pytest -o addopts='-vv'
          tests/test_google_adk_installed_contract.py
          tests/test_google_adk_example.py
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: py311-base
            python-version: '3.11'
            sync-command: uv sync --frozen
            pytest-command: uv run pytest --ignore=tests/cli --ignore=tests/mcp
          - name: py312-base
            python-version: '3.12'
            sync-command: uv sync --frozen
            pytest-command: uv run pytest --ignore=tests/cli --ignore=tests/mcp
          - name: py313-base
            python-version: '3.13'
            sync-command: uv sync --frozen
            pytest-command: uv run pytest --ignore=tests/cli --ignore=tests/mcp
          - name: py314-base
            python-version: '3.14'
            sync-command: uv sync --frozen
            pytest-command: uv run pytest --ignore=tests/cli --ignore=tests/mcp
          - name: py311-cli
            python-version: '3.11'
            sync-command: uv sync --frozen --extra cli --extra worker
            pytest-command: uv run pytest tests/cli
          - name: py312-cli
            python-version: '3.12'
            sync-command: uv sync --frozen --extra cli --extra worker
            pytest-command: uv run pytest tests/cli
          - name: py313-cli
            python-version: '3.13'
            sync-command: uv sync --frozen --extra cli --extra worker
            pytest-command: uv run pytest tests/cli
          - name: py314-cli
            python-version: '3.14'
            sync-command: uv sync --frozen --extra cli --extra worker
            pytest-command: uv run pytest tests/cli
          - name: py311-mcp
            python-version: '3.11'
            sync-command: uv sync --frozen --extra mcp
            pytest-command: uv run pytest tests/mcp
          - name: py312-mcp
            python-version: '3.12'
            sync-command: uv sync --frozen --extra mcp
            pytest-command: uv run pytest tests/mcp
          - name: py313-mcp
            python-version: '3.13'
            sync-command: uv sync --frozen --extra mcp
            pytest-command: uv run pytest tests/mcp
          - name: py314-mcp
            python-version: '3.14'
            sync-command: uv sync --frozen --extra mcp
            pytest-command: uv run pytest tests/mcp
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: ${{ matrix.sync-command }}
      - name: Verify base install does not resolve MCP
        if: contains(matrix.name, 'base')
        run: >-
          uv run python -c "import importlib.util; import kitaru; import kitaru.client;
          assert importlib.util.find_spec('mcp') is None"
      - run: ${{ matrix.pytest-command }}
