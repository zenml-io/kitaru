---
name: Release Kitaru
on:
  workflow_dispatch:
    inputs:
      package-tag:
        description: Core package tag to rehearse, such as python/kitaru/v0.22.0rc4.
        required: true
        type: string
  push:
    tags: [python/kitaru/v*]
permissions: {}
concurrency:
  group: release-kitaru-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bundle-version: ${{ steps.metadata.outputs.bundle-version }}
      is-prerelease: ${{ steps.metadata.outputs.is-prerelease }}
      maintenance-branch: ${{ steps.metadata.outputs.maintenance-branch }}
      package-tag: ${{ steps.metadata.outputs.package-tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Resolve release metadata
        id: metadata
        env:
          DISPATCH_TAG: ${{ inputs.package-tag }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            package_tag="$PUSH_TAG"
          else
            package_tag="$DISPATCH_TAG"
          fi
          unit=$(uv run --no-project --with packaging==26.2 python scripts/release_units.py resolve --tag "$package_tag" --format json)
          distribution=$(jq -r '.unit.distribution' <<<"$unit")
          maintenance_branch=$(jq -r '.unit.maintenance_branch' <<<"$unit")
          version=$(jq -r '.unit.version' <<<"$unit")
          if [ "$distribution" != kitaru ]; then
            echo "::error::Plugin releases belong in release-plugins.yml."
            exit 1
          fi
          is_prerelease=false
          if [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)rc([0-9]+)$ ]]; then
            bundle_version="${BASH_REMATCH[1]}-rc.${BASH_REMATCH[2]}"
            is_prerelease=true
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            bundle_version="$version"
          else
            echo "::error::Core releases require X.Y.Z or X.Y.ZrcN, got $version"
            exit 1
          fi
          {
            printf 'BUNDLE_VERSION=%s\n' "$bundle_version"
            printf 'IS_PRERELEASE=%s\n' "$is_prerelease"
            printf 'MAINTENANCE_BRANCH=%s\n' "$maintenance_branch"
            printf 'PACKAGE_TAG=%s\n' "$package_tag"
            printf 'VERSION=%s\n' "$version"
          } >> "$GITHUB_ENV"
          {
            printf 'bundle-version=%s\n' "$bundle_version"
            printf 'is-prerelease=%s\n' "$is_prerelease"
            printf 'maintenance-branch=%s\n' "$maintenance_branch"
            printf 'package-tag=%s\n' "$package_tag"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"
      - name: Validate release source
        run: |
          set -euo pipefail
          git fetch origin develop
          release_sha=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$release_sha" origin/develop; then
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$MAINTENANCE_BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$MAINTENANCE_BRANCH:refs/remotes/origin/$MAINTENANCE_BRANCH"
            if git merge-base --is-ancestor "$release_sha" "origin/$MAINTENANCE_BRANCH"; then
              exit 0
            fi
          fi
          echo "::error::$PACKAGE_TAG points to $release_sha, which is on neither develop nor $MAINTENANCE_BRANCH."
          exit 1
      - name: Resolve exact frontend artifact
        run: |
          set -euo pipefail
          ui=$(uv run --no-project python scripts/release_ui.py --version "$VERSION")
          {
            printf 'KITARU_UI_ALLOW_PRERELEASE=%s\n' "$(jq -r '.allow_prerelease' <<<"$ui")"
            printf 'KITARU_UI_RELEASE_REPO=%s\n' "$(jq -r '.repository' <<<"$ui")"
            printf 'KITARU_UI_TAG=%s\n' "$(jq -r '.tag' <<<"$ui")"
          } >> "$GITHUB_ENV"
      - name: Download exact frontend artifact
        env:
          KITARU_UI_RELEASE_TOKEN: ${{ secrets.KITARU_UI_RELEASE_TOKEN }}
        run: bash scripts/download-ui.sh
      - name: Compress the sample data
        run: |
          sample_data=src/kitaru/server/application/services/sample_data.json
          gzip -9 -n -c "$sample_data" > "$sample_data.gz"
      - name: Build Kitaru Python distribution
        run: |
          uv build --out-dir package-dist
          wheel=$(find package-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          uv run --no-project scripts/verify-ui-wheel.py "$wheel"
      - name: Test installed distribution
        run: |
          set -euo pipefail
          wheel=$(find package-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          DIST_FILE="$wheel" uv run --no-project \
            --exclude-newer-package "kitaru=0 days" \
            --with "$wheel" python - <<'PY'
          import importlib.metadata
          import os
          assert importlib.metadata.version("kitaru") == os.environ["VERSION"]
          PY
      - name: Record artifact checksums
        run: |
          mkdir evidence
          sha256sum -- package-dist/*.whl package-dist/*.tar.gz > evidence/SHA256SUMS
          cat evidence/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-distribution
          path: |
            package-dist/*
            evidence/*
          if-no-files-found: error
          retention-days: 90
  publish-python:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-kitaru
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-distribution
          path: .
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: package-dist
          skip-existing: true
  publish-deployables:
    needs: [build, publish-python]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm Kitaru exists on PyPI
        env:
          KITARU_VERSION: ${{ needs.build.outputs.version }}
        run: curl -fsS "https://pypi.org/pypi/kitaru/$KITARU_VERSION/json" >/dev/null
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Build and test client image
        env:
          KITARU_VERSION: ${{ needs.build.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --load --platform "$platform" -f docker/release-client.Dockerfile \
              --target client --build-arg KITARU_VERSION="$KITARU_VERSION" \
              -t kitaru-bundle-client:test .
            docker run --rm --platform "$platform" kitaru-bundle-client:test python -c "import kitaru"
          done
      - name: Build and test server image
        env:
          KITARU_VERSION: ${{ needs.build.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --load --platform "$platform" -f docker/release-server.Dockerfile \
              --target server --build-arg KITARU_VERSION="$KITARU_VERSION" \
              -t kitaru-bundle-server:test .
            docker run --rm --platform "$platform" kitaru-bundle-server:test python -c "import kitaru"
          done
      - name: Build and test worker image
        env:
          KITARU_VERSION: ${{ needs.build.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --load --platform "$platform" -f docker/release-worker.Dockerfile \
              --target worker --build-arg KITARU_VERSION="$KITARU_VERSION" \
              -t kitaru-bundle-worker:test .
            docker run --rm --platform "$platform" kitaru-bundle-worker:test python -c "import kitaru"
          done
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.9.2
      - name: Build Helm chart
        env:
          BUNDLE_VERSION: ${{ needs.build.outputs.bundle-version }}
        run: |
          sed -i "s/^version: .*/version: \"$BUNDLE_VERSION\"/" helm/Chart.yaml
          helm lint ./helm
          helm package ./helm --destination bundle-dist
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish client image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/release-client.Dockerfile
          target: client
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: KITARU_VERSION=${{ needs.build.outputs.version }}
          tags: zenmldocker/kitaru:${{ needs.build.outputs.bundle-version }}
      - name: Publish worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/release-worker.Dockerfile
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: KITARU_VERSION=${{ needs.build.outputs.version }}
          tags: zenmldocker/kitaru-worker:${{ needs.build.outputs.bundle-version }}
      - name: Publish server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/release-server.Dockerfile
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: KITARU_VERSION=${{ needs.build.outputs.version }}
          tags: zenmldocker/kitaru-server:${{ needs.build.outputs.bundle-version }}
      - name: Publish managed image
        id: publish-managed-image
        continue-on-error: true
        uses: ./.github/actions/publish-managed-image
        with:
          package-version: ${{ needs.build.outputs.version }}
          image-tag: ${{ needs.build.outputs.bundle-version }}
          aws-role-arn: ${{ vars.KITARU_ECR_ROLE_ARN }}
      - name: Report managed image failure
        if: steps.publish-managed-image.outcome == 'failure'
        run: |
          echo "::warning::Managed image publication failed; continuing with the public release artifacts."
          echo "### Managed image publication failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The private ECR images are unavailable for this release. Public Docker Hub images and the Helm chart continue publishing." >> "$GITHUB_STEP_SUMMARY"
      - name: Configure AWS credentials for Helm
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::715803424590:role/gh-action-role-zenml-helm
          aws-region: us-east-1
      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
        with:
          mask-password: 'true'
          registry-type: public
      - name: Publish Helm chart
        env:
          BUNDLE_VERSION: ${{ needs.build.outputs.bundle-version }}
          REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
        run: helm push "bundle-dist/kitaru-$BUNDLE_VERSION.tgz" "oci://$REGISTRY/zenml"
  promote-latest:
    if: needs.build.outputs.is-prerelease == 'false'
    needs: [build, publish-deployables]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Move Docker latest aliases
        env:
          BUNDLE_VERSION: ${{ needs.build.outputs.bundle-version }}
        run: |-
          docker buildx imagetools create --tag zenmldocker/kitaru:latest "zenmldocker/kitaru:$BUNDLE_VERSION"
          docker buildx imagetools create --tag zenmldocker/kitaru-worker:latest "zenmldocker/kitaru-worker:$BUNDLE_VERSION"
          docker buildx imagetools create --tag zenmldocker/kitaru-server:latest "zenmldocker/kitaru-server:$BUNDLE_VERSION"
  create-release:
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.publish-python.result == 'success' &&
      needs.publish-deployables.result == 'success' &&
      (needs.build.outputs.is-prerelease == 'true' ||
      needs.promote-latest.result == 'success')
    needs: [build, publish-python, publish-deployables, promote-latest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-distribution
          path: .
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ needs.build.outputs.is-prerelease }}
          PACKAGE_TAG: ${{ needs.build.outputs.package-tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |-
          set -euo pipefail
          if gh release view "$PACKAGE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $PACKAGE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          prerelease=()
          latest=(--latest=false)
          if [ "$IS_PRERELEASE" = true ]; then
            prerelease+=(--prerelease)
          else
            latest=(--latest)
          fi
          gh release create "$PACKAGE_TAG" package-dist/* evidence/* \
            "${prerelease[@]}" \
            --verify-tag \
            "${latest[@]}" \
            --title "kitaru $VERSION" \
            --generate-notes
  advance-maintenance-branch:
    if: >-
      github.event_name == 'push' &&
      needs.build.outputs.is-prerelease == 'false'
    needs: [build, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Advance stable maintenance branch
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_BRANCH: ${{ needs.build.outputs.maintenance-branch }}
        run: |-
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          if git ls-remote --exit-code --heads origin "$MAINTENANCE_BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$MAINTENANCE_BRANCH:refs/remotes/origin/$MAINTENANCE_BRANCH"
            if git merge-base --is-ancestor "origin/$MAINTENANCE_BRANCH" "$release_sha"; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/heads/$MAINTENANCE_BRANCH" \
                -f sha="$release_sha" -F force=false >/dev/null
            elif git merge-base --is-ancestor "$release_sha" "origin/$MAINTENANCE_BRANCH"; then
              echo "$MAINTENANCE_BRANCH is already ahead of this release; leaving it unchanged."
            else
              echo "::error::$MAINTENANCE_BRANCH cannot advance to $release_sha without diverging."
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/heads/$MAINTENANCE_BRANCH" \
              -f sha="$release_sha" >/dev/null
          fi
  create-development-reset-pr:
    if: >-
      github.event_name == 'push' &&
      needs.build.outputs.is-prerelease == 'false'
    needs: [build, create-release, advance-maintenance-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: develop
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Resolve development reset state
        id: reset
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GIT_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |-
          set -euo pipefail
          branch="automation/kitaru-$VERSION-development"
          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --state all --json number --jq 'length > 0' | grep -qx true; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "action=open" >> "$GITHUB_OUTPUT"
          else
            echo "action=create" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare development reset
        if: steps.reset.outputs.action == 'create'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |-
          uv run --no-project --with packaging==26.2 \
            python scripts/release_units.py prepare-core-development-reset \
            --release-version "$VERSION"
          uv lock --check
          uv lock --project plugins --check
          git diff --check
      - name: Push development reset branch
        if: steps.reset.outputs.action == 'create'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GIT_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |-
          set -euo pipefail
          branch="automation/kitaru-$VERSION-development"
          git config user.name "kitaru-release[bot]"
          git config user.email "kitaru-release[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add pyproject.toml uv.lock plugins/uv.lock openapi/openapi.json CHANGELOG.md
          git commit -m "Start Kitaru $VERSION development"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
      - name: Open draft development reset PR
        if: steps.reset.outputs.action != 'skip'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GIT_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |-
          set -euo pipefail
          branch="automation/kitaru-$VERSION-development"
          # shellcheck disable=SC2016  # Markdown backticks are intentional.
          printf -v body '## Summary\n\n- set the core development version to `%s+dev`\n- restore the `Unreleased` changelog section\n- update both core lockfile entries and generated OpenAPI version\n\n## Merge order\n\nMerge this PR only after `main` contains release commit `%s`, so `main` remains at the clean `%s` release state.\n\n## Reviewer Notes\n\nConfirm the diff contains only `pyproject.toml`, `uv.lock`, `plugins/uv.lock`, `openapi/openapi.json`, and `CHANGELOG.md`. Verify `main` contains `%s` before marking this draft ready.\n' "$VERSION" "$RELEASE_SHA" "$VERSION" "$RELEASE_SHA"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base develop \
            --head "$branch" \
            --draft \
            --title "Start Kitaru $VERSION development" \
            --body "$body"
