---
name: Kitaru image vulnerability scan
on:
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch:
permissions: {}
concurrency:
  group: kitaru-image-vulnerability-scan
  cancel-in-progress: false
env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: kitaru-pro-server
  ECR_REGISTRY: 715803424590.dkr.ecr.eu-central-1.amazonaws.com
jobs:
  discover:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d  # v6.2.2
        with:
          role-to-assume: ${{ vars.KITARU_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Discover released image digests
        id: images
        run: |
          set -euo pipefail
          images=$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --filter tagStatus=TAGGED \
              --output json |
              jq -c '[
                .imageDetails[]
                | select(
                    any(
                      .imageTags[]?;
                      test("^[0-9]+\\.[0-9]+\\.[0-9]+([-.][A-Za-z0-9.]+)?$")
                    )
                  )
                | {digest: .imageDigest}
              ] | unique_by(.digest)'
          )
          if [ "$images" = '[]' ]; then
            echo "::error::No released Kitaru images were found."
            exit 1
          fi
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"
  scan:
    needs: discover
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d  # v6.2.2
        with:
          role-to-assume: ${{ vars.KITARU_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to private Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6
        with:
          mask-password: 'true'
      - name: Scan released image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ matrix.image.digest
            }}
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1
