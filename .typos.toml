[files]
extend-exclude = [
    "*.json",
    "*.js",
    "*.ipynb",
    "uv.lock",
    "docs/pnpm-lock.yaml",
    "docs/.source/",
    "docs/node_modules/",
    "design/",
    "spec/"
]

[default.extend-identifiers]
HashiCorp = "HashiCorp"
# OpenAI Agents SDK stream event name is misspelled in the public SDK.
handoff_occured = "handoff_occured"
# Deliberate misspelling in a test asserting that an unknown replay model
# setting is rejected rather than silently ignored.
temprature = "temprature"
MockValSer = "MockValSer"

[default.extend-words]
# Don't correct the surname "Teh"
aks = "aks"
# FumaDocs / Next.js / React terms
fumadocs = "fumadocs"
mdx = "mdx"
tsx = "tsx"
mjs = "mjs"
unoptimized = "unoptimized"
prerendered = "prerendered"
# Kitaru product terms
kitaru = "kitaru"
fumapy = "fumapy"
griffe = "griffe"
# British spelling in the actual workflow filename (image-optimiser.yml)
optimiser = "optimiser"

[default]
locale = "en-us"
